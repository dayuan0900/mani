<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Sumeru Galaxy Disk</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', monospace; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(12, 10, 8, 0.85);
            border: 1px solid rgba(255,200,0,0.2);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 10px 60px rgba(0,0,0,0.9);
        }

        h3 { 
            margin: 0 0 10px 0; color: #ffca28; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,200,0,0.4);
        }

        #status {
            font-size: 10px; color: #888; text-align: center; margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;
            height: 15px; white-space: nowrap; overflow: hidden;
        }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffca28, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 12px; letter-spacing: 1px;
        }
        .btn:hover { filter: brightness(1.1); box-shadow: 0 0 20px rgba(255,160,0,0.4); }

        .control { margin-bottom: 10px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-bottom: 3px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffca28; height: 2px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }
        input[type="color"] { width: 100%; height: 25px; border: none; padding: 0; background: none; }

        .hint { font-size: 9px; color: #555; text-align: center; margin-top: 8px; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>SUMERU GALAXY DISK</h3>
    <div id="status">系统就绪</div>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" onclick="runGen()">ACTIVATE / 激活</button>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:12px 0;"></div>

    <!-- 找回的滑块 -->
    <div class="control">
        <label>GALAXY Y-POS / 星系上下调节 <span id="val-ypos">0</span></label>
        <input type="range" min="-300" max="300" value="0" oninput="updateConfig('orbitY', this.value)">
    </div>

    <div class="control">
        <label>GALAXY TILT / 星系倾斜度</label>
        <input type="range" min="0" max="60" value="25" oninput="config.orbitTilt=this.value*0.01">
    </div>

    <div class="control">
        <label>GALAXY SIZE / 星系大小</label>
        <input type="range" id="ringCount" min="2000" max="8000" step="500" value="4000" oninput="initOrbit()">
    </div>

    <div class="control">
        <label>TEXT SPACING / 字间距</label>
        <input type="range" min="100" max="200" value="100" oninput="config.letterSpacing=this.value/100">
    </div>

    <div class="control">
        <label>TEXT DENSITY / 文字密度</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="3" oninput="resampleImage()">
    </div>

    <div class="control">
        <label>COLOR / 主题色</label>
        <input type="color" id="colorPicker" value="#ffca28" oninput="updateConfig('color', this.value)">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏 | 滚轮缩放</div>
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    const statusEl = document.getElementById('status');
    function setStatus(msg, isError=false) {
        statusEl.innerText = msg;
        statusEl.style.color = isError ? '#ff5555' : '#0f0';
    }
    window.onerror = function(msg) { setStatus("Err: " + msg, true); };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let textParticles = [];
    let orbitParticles = [];
    let cachedImageData = null;
    let cachedWidth = 0; 
    let cachedHeight = 0;

    let config = {
        baseX: 0, baseY: 0, 
        scale: 1, 
        targetScale: 0.30, 
        color: '#ffca28', // 金黄色
        pSize: 1.0,      
        glow: 20,
        orbitSpeed: 0.005, 
        orbitTilt: 0.25,    // 默认稍微倾斜一点，像盘子
        orbitY: 0,          // 找回的垂直位置参数
        letterSpacing: 1.0 
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        if(cachedWidth > 0) updateScale();
        initOrbit();
    }
    window.addEventListener('resize', resize);

    function updateScale() {
        config.scale = (window.innerWidth * config.targetScale) / cachedWidth; 
    }

    // --- 1. 星系盘核心系统 (Galaxy Disk Algorithm) ---
    // 参考图2：核心极亮极密，边缘稀疏，呈盘状
    function initOrbit() {
        orbitParticles = [];
        const count = parseInt(document.getElementById('ringCount').value) || 4000;
        
        for(let i=0; i<count; i++) {
            // 角度均匀分布
            const angle = Math.random() * Math.PI * 2;
            
            // 半径：使用高斯分布/指数分布，让粒子疯狂聚集在中心
            // Math.random()^2 会让大部分数值很小（靠近圆心）
            // 形成：核心(极密) -> 外部(渐疏)
            const dist = Math.pow(Math.random(), 1.5); 
            
            const maxR = Math.max(canvas.width, canvas.height) * 0.7;
            const r = dist * maxR; 
            
            // 速度：核心转得快，外圈转得慢 (开普勒运动)
            const speed = (200 / (r+50)) * 0.001 + 0.0002;

            // 颜色亮度：核心接近白色，外部是金黄色
            const brightness = 1 - dist; // 越靠近中心越亮

            orbitParticles.push({
                angle: angle,
                r: r,
                speed: speed,
                // 粒子大小：核心粒子稍微大一点点，形成光团感
                size: Math.random() * 1.5 + 0.5 + (brightness * 0.5),
                brightness: brightness,
                // 垂直随机抖动，形成“厚度”
                yOffset: (Math.random() - 0.5) * 30 * (1-dist) 
            });
        }
        setStatus(`星系粒子: ${count}`);
    }

    // --- 2. 图像引擎 ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="1500" height="1500" ');
        }
        return svg;
    }

    function processSource(src) {
        setStatus("读取中...");
        const img = new Image();
        img.onload = () => {
            setStatus("解析中...");
            const w = 1500; const h = 1000;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            const padding = 150;
            const drawW = w - padding*2;
            const drawH = h - padding*2;
            
            let dw=drawW, dh=drawW/aspect;
            if(dh > drawH){ dh=drawH; dw=drawH*aspect; }
            
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            cachedImageData = offCtx.getImageData(0,0,w,h).data;
            cachedWidth = w; cachedHeight = h;
            
            resampleImage(); 
            updateScale(); 
            setStatus(`生成成功`);
        };
        img.onerror = () => setStatus("加载失败", true);
        img.src = src;
    }

    function resampleImage() {
        if (!cachedImageData) return;
        textParticles = [];
        const val = parseInt(document.getElementById('densityRange').value);
        const gap = Math.max(2, 7 - val); 
        
        const w = cachedWidth; const h = cachedHeight;
        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const lum = (cachedImageData[i] + cachedImageData[i+1] + cachedImageData[i+2])/3;
                if(Math.abs(lum - 128) > 20) {
                    textParticles.push({
                        ox: x-w/2 + (Math.random()-0.5)*gap*0.5, 
                        oy: y-h/2 + (Math.random()-0.5)*gap*0.5 
                    });
                }
            }
        }
    }

    // --- 3. 渲染循环 ---
    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // A. 绘制星系盘 (Galaxy Disk)
        ctx.globalCompositeOperation = 'lighter';
        
        orbitParticles.forEach(p => {
            p.angle += p.speed;
            const z = Math.sin(p.angle);
            
            // 3D 投影计算
            // 加入 config.orbitY 实现上下移动
            const x = config.baseX + Math.cos(p.angle) * p.r;
            const y = (config.baseY + config.orbitY) + Math.sin(p.angle) * p.r * config.orbitTilt + p.yOffset;
            
            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI*2);
            
            // 颜色计算：核心白亮，边缘金黄，背面变暗
            // brightness 是距离中心的亮度系数
            const depth = z > 0 ? 1 : 0.3; // 前后遮挡
            const alpha = (p.brightness * 0.8 + 0.2) * depth;
            
            // 核心区域强制白光
            if(p.brightness > 0.8) ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            else ctx.fillStyle = config.color; // 外部使用主题色(金)
            
            ctx.globalAlpha = alpha;
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // B. 绘制文字 (Text)
        ctx.shadowBlur = config.glow;             
        ctx.shadowColor = config.color;           
        ctx.fillStyle = '#FFFFFF'; 

        textParticles.forEach(p => {
            const tx = config.baseX + (p.ox * config.letterSpacing * config.scale);
            const ty = config.baseY + (p.oy * config.scale);
            
            ctx.beginPath();
            ctx.arc(tx, ty, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    // 交互
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { setStatus("请选文件", true); return; }
        const file = input.files[0];
        const r = new FileReader();
        if(file.type.includes('svg')) {
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.updateConfig = function(key, val) {
        if(key === 'zoom') {
            config.targetScale = val / 100;
            if(cachedWidth > 0) updateScale();
        } 
        else if (key === 'orbitY') { 
            config.orbitY = parseInt(val); 
            document.getElementById('val-ypos').innerText = val;
        }
        else if (key === 'color') { config.color = val; }
    };

    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'h') document.getElementById('ui').classList.toggle('hidden');
    });
    
    window.addEventListener('wheel', e => {
        let currentScale = config.targetScale;
        currentScale += e.deltaY * -0.0005;
        currentScale = Math.min(Math.max(0.05, currentScale), 1.0);
        config.targetScale = currentScale;
        if(cachedWidth > 0) updateScale();
    });

    resize();
    initOrbit();
    animate();

</script>
</body>
</html>
