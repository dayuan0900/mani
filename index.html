<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Hyper Speed</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(255,215,0,0.3); /* 金色边框 */
            border-radius: 12px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .hidden { opacity: 0; pointer-events: none; transform: translateX(-30px); }

        h3 { 
            margin: 0 0 10px 0; color: #ffd700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        #fps-counter {
            font-size: 9px; color: #666; text-align: right; margin-bottom: 5px;
        }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            color: #000; font-weight: bold; cursor: pointer;
            transition: 0.2s; font-size: 12px;
        }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px #ffd700; }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 4px; letter-spacing: 1px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffd700; height: 3px; }
        input[type="color"] { width: 100%; border: none; height: 25px; padding: 0; background: none; cursor: pointer; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }

        .hint { font-size: 9px; color: #555; text-align: center; margin-top: 10px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>HYPER SPEED RING</h3>
    <div id="fps-counter">FPS: 60</div>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" onclick="runGen()">ACTIVATE / 启动</button>
    </div>

    <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <!-- 速度滑块：上限调高了5倍 -->
    <div class="control">
        <label>ORBIT SPEED / 旋绕速度 (极速)</label>
        <input type="range" id="speedRange" min="0" max="100" value="40" oninput="config.orbitSpeed=this.value*0.0005">
    </div>

    <div class="control">
        <label>RING VERTICAL POS / 光环上下位置</label>
        <input type="range" min="-300" max="300" value="0" oninput="config.orbitYOffset=parseInt(this.value)">
    </div>

    <div class="control">
        <label>RING PARTICLES / 光环粒子数</label>
        <input type="range" id="ringCount" min="500" max="4000" step="100" value="2500" oninput="initOrbit()">
    </div>

    <div class="control">
        <label>TEXT DENSITY / 文字密度</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="4" oninput="resampleImage()">
    </div>

    <div class="control">
        <label>COLOR / 主题色</label>
        <input type="color" id="colorPicker" value="#ffd700" oninput="updateConfig('color', this.value)">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    // --- 0. 基础设置 ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fpsEl = document.getElementById('fps-counter');
    
    let textParticles = [];
    let orbitParticles = []; 
    let cachedImageData = null; 
    let cachedWidth = 0;
    let cachedHeight = 0;
    let lastTime = 0;

    let config = {
        baseX: 0, baseY: 0, 
        scale: 1,        
        targetScale: 0.40, 
        color: '#ffd700', 
        pSize: 1.0,      
        glow: 25,        
        orbitSpeed: 0.02, // 默认速度调快
        orbitYOffset: 0,  // 光环上下偏移
        orbitTilt: 0.15   // 扁平度
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        if (cachedWidth > 0) config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
        initOrbit();
    }
    window.addEventListener('resize', resize);

    // --- 1. 高速光环系统 ---
    function initOrbit() {
        orbitParticles = [];
        const count = parseInt(document.getElementById('ringCount').value);
        for(let i=0; i<count; i++) orbitParticles.push(new OrbitParticle());
    }

    class OrbitParticle {
        constructor() { this.reset(); }
        
        reset() {
            this.angle = Math.random() * Math.PI * 2;
            
            // 半径分布优化：更宽阔的环带
            const minR = Math.min(canvas.width, canvas.height) * 0.3;
            const maxR = Math.min(canvas.width, canvas.height) * 1.0;
            // 指数分布，让粒子更多聚集在内圈附近，显得更亮
            const rFactor = Math.pow(Math.random(), 2); 
            this.radius = minR + rFactor * (maxR - minR);
            
            // 速度：内圈快，外圈慢 (开普勒定律模拟)
            this.speedFactor = (500 / this.radius) * 0.5 + Math.random() * 0.1;
            
            this.size = Math.random() * 1.8 + 0.5;
            this.alpha = Math.random() * 0.7 + 0.3;
        }

        update() {
            // 速度 = 基础倍率 * 个体因子
