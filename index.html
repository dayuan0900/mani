<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - Instant Run</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        
        #ui {
            position: absolute; top: 10px; left: 10px; width: 280px;
            background: rgba(10, 20, 30, 0.95);
            border: 1px solid #444; border-radius: 8px;
            padding: 15px; color: #fff; z-index: 100;
        }

        /* 状态指示灯 */
        #status-light {
            display: inline-block; width: 12px; height: 12px; 
            background: #f00; border-radius: 50%; margin-right: 8px;
            border: 2px solid #fff;
        }

        #console {
            height: 100px; background: #000; color: #0f0; 
            overflow-y: auto; border: 1px solid #333; 
            margin-bottom: 10px; padding: 5px; font-size: 11px;
            white-space: pre-wrap;
        }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: #00e5ff; color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 14px;
        }
        .btn:hover { background: #fff; }

        input { width: 100%; margin-bottom: 5px; }
        canvas { display: block; }
    </style>
    
    <!-- 1. 全局错误捕获 (放在最前面) -->
    <script>
        window.onerror = function(msg, url, line) {
            alert("JS Error: " + msg);
            document.getElementById('console').innerHTML += "\n❌ ERROR: " + msg;
        };
    </script>
</head>
<body>

<div id="ui">
    <div style="margin-bottom:10px; display:flex; align-items:center;">
        <span id="status-light"></span> 
        <span id="status-text">系统初始化...</span>
    </div>
    
    <div id="console"></div>
    
    <label>上传文件 (SVG/PNG)</label>
    <input type="file" id="imageInput">
    
    <button class="btn" onclick="runGen()">⚡ 激活粒子</button>
    <button class="btn" style="background:#444; color:#ccc; margin-top:5px;" onclick="runTest()">🛠️ 生成测试图</button>

    <div style="margin-top:15px; border-top:1px solid #333; padding-top:10px; font-size:11px;">
        粒子大小: <input type="range" id="sizeRange" min="1" max="6" value="3">
        颜色: <input type="color" id="colorPicker" value="#00e5ff" style="height:20px; border:none;">
    </div>
</div>

<canvas id="canvas"></canvas>

<!-- 2. 核心代码 (放在底部，且不使用 onload 监听) -->
<script>
    // --- 立即执行区域 ---
    const logBox = document.getElementById('console');
    const statusLight = document.getElementById('status-light');
    const statusText = document.getElementById('status-text');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function log(msg) {
        logBox.innerHTML = "> " + msg + "\n" + logBox.innerHTML;
        console.log(msg);
    }

    // 1. 强制点亮绿灯 (证明JS跑起来了)
    statusLight.style.background = '#0f0';
    statusLight.style.boxShadow = '0 0 10px #0f0';
    statusText.innerText = "引擎已就绪";
    log("JS核心已挂载");

    // --- 变量 ---
    let particles = [];
    let nebula = [];
    let config = {
        baseX: window.innerWidth/2, 
        baseY: window.innerHeight/2, 
        scale: 1,
        color: '#00e5ff',
        pSize: 3
    };

    // --- 初始化函数 ---
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        
        // 重置星云
        nebula = [];
        for(let i=0; i<30; i++) {
            nebula.push({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                r: Math.random()*200+50,
                vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
                hue: Math.random()>0.5 ? 200:260, alpha: 0
            });
        }
    }
    window.addEventListener('resize', resize);
    resize(); // 立即执行一次

    // --- 图像处理引擎 ---
    function processSource(imgSrc) {
        log("加载图像中...");
        const img = new Image();
        img.crossOrigin = "Anonymous";
        
        img.onload = () => {
            log(`尺寸: ${img.width}x${img.height}`);
            
            // 强制渲染 Canvas
            const w = 800; const h = 600;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            // 铺灰底
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            // 绘制
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            // 采样
            const data = offCtx.getImageData(0,0,w,h).data;
            particles = [];
            const gap = 3;
            
            log("正在生成粒子...");
            for(let y=0; y<h; y+=gap) {
                for(let x=0; x<w; x+=gap) {
                    const i = (y*w+x)*4;
                    const lum = (data[i]+data[i+1]+data[i+2])/3;
                    if(x+gap<w) {
                        const lum2 = (data[i+4*gap]+data[i+4*gap+1]+data[i+4*gap+2])/3;
                        if(Math.abs(lum-lum2) > 20) {
                            particles.push({
                                x: Math.random()*canvas.width,
                                y: Math.random()*canvas.height,
                                ox: x-w/2, oy: y-h/2,
                                vx:0, vy:0,
                                offset: Math.random()*100
                            });
                        }
                    }
                }
            }
            log(`✅ 生成: ${particles.length} 粒子`);
            
            if(particles.length > 0) {
                config.scale = (window.innerWidth*0.8)/w;
            } else {
                alert("未检测到轮廓，请检查图片！");
            }
        };
        img.onerror = () => alert("图片加载失败");
        img.src = imgSrc;
    }

    // --- 按钮绑定 (直接暴露给 window) ---
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请先选择图片"); return; }
        
        const reader = new FileReader();
        reader.onload = e => processSource(e.target.result);
        reader.readAsDataURL(input.files[0]);
    };

    window.runTest = function() {
        log("生成测试图...");
        const t = document.createElement('canvas');
        t.width=600; t.height=300;
        const c = t.getContext('2d');
        c.fillStyle="#fff"; c.fillRect(0,0,600,300);
        c.fillStyle="#000"; c.font="bold 100px Arial"; c.fillText("TEST", 150, 180);
        processSource(t.toDataURL());
    };

    // --- 动画循环 ---
    function animate() {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        const time = Date.now() * 0.002;

        // 星云
        ctx.globalCompositeOperation = 'lighter';
        nebula.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
            if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
            if(p.alpha<0.1) p.alpha+=0.0005;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
            g.addColorStop(0, `hsla(${p.hue}, 80%, 60%, ${p.alpha})`);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle=g; ctx.fill();
        });

        // 粒子
        ctx.shadowBlur = 10; ctx.shadowColor = config.color;
        ctx.fillStyle = config.color;
        
        particles.forEach(p => {
            const wx = Math.sin(time + p.offset) * 5; // 飘动
            const wy = Math.cos(time + p.offset) * 5;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.8; p.vy *= 0.8;

            ctx.beginPath();
            ctx.arc(p.x, p.y, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }
    
    // UI 监听
    document.getElementById('sizeRange').oninput = function() { config.pSize = parseFloat(this.value); };
    document.getElementById('colorPicker').oninput = function() { config.color = this.value; };

    // 启动动画
    animate();

</script>
</body>
</html>
