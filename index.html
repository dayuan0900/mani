<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Sacred Orbit</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(20, 15, 10, 0.8); /* 偏暖色调的背景 */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.15); /* 金色边框 */
            border-radius: 12px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }
        
        .hidden { opacity: 0; pointer-events: none; transform: translateX(-30px); }

        h3 { 
            margin: 0 0 10px 0; color: #ffd700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        #status-bar {
            font-size: 10px; color: #aaa; text-align: center; margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
        }

        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            /* 金色渐变按钮 */
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 8px; transition: 0.2s; font-size: 12px;
        }
        .btn:hover { box-shadow: 0 0 15px rgba(255,215,0,0.5); filter: brightness(1.1); }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #ccc; margin-bottom: 3px; letter-spacing: 1px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffd700; height: 2px; }
        input[type="color"] { width: 100%; border: none; height: 20px; padding: 0; background: none; cursor: pointer; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 10px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>SACRED ORBIT</h3>
    <div id="status-bar">等待 SVG 文件...</div>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" onclick="runGen()">ACTIVATE / 激活法座</button>
    </div>

    <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <div class="control">
        <label>ZOOM / 缩放 <span id="val-zoom">40%</span></label>
        <input type="range" min="10" max="100" value="40" oninput="updateConfig('zoom', this.value)">
    </div>

    <div class="control">
        <label>ORBIT SPEED / 旋绕速度</label>
        <input type="range" id="speedRange" min="0" max="50" value="15" oninput="config.orbitSpeed=this.value*0.0001">
    </div>

    <div class="control">
        <label>DENSITY / 文字密度</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="3" oninput="resampleImage()">
    </div>

    <div class="control">
        <label>COLOR / 主题色</label>
        <input type="color" id="colorPicker" value="#ffd700" oninput="updateConfig('color', this.value)">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    const statusEl = document.getElementById('status-bar');
    function setStatus(msg, isError=false) {
        statusEl.innerText = msg;
        statusEl.style.color = isError ? '#ff5555' : '#888';
    }
    window.onerror = function(msg) { setStatus("Err: " + msg, true); };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let textParticles = [];
    let orbitParticles = []; // 旋绕粒子
    let cachedImageData = null; 
    let cachedWidth = 0;
    let cachedHeight = 0;

    let config = {
        baseX: 0, baseY: 0, 
        scale: 1,        
        targetScale: 0.40, 
        color: '#ffd700', // 默认金色
        pSize: 1.2,      
        glow: 20,        
        orbitSpeed: 0.0015, // 旋转速度
        orbitRadius: 1.0    // 环绕半径系数
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        
        if (cachedWidth > 0) {
            config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
        }
        initOrbit();
    }
    window.addEventListener('resize', resize);

    // --- 1. 右旋粒子光环 (Right-Turning Orbit) ---
    function initOrbit() {
        orbitParticles = [];
        const count = 1500; // 粒子数量，形成流动的光带
        
        for(let i=0; i<count; i++) {
            orbitParticles.push(new OrbitParticle());
        }
    }

    class OrbitParticle {
        constructor() { this.reset(true); }
        
        reset(randomStart = false) {
            // 随机角度
            this.angle = Math.random() * Math.PI * 2;
            
            // 半径分布：主要集中在外部，形成光环
            // 基础半径 + 随机扩散
            const minR = Math.min(canvas.width, canvas.height) * 0.35;
            const maxR = Math.min(canvas.width, canvas.height) * 0.9;
            this.radius = minR + Math.random() * (maxR - minR);
            
            // 速度：近快远慢，模拟引力
            // 正数 = 右旋 (顺时针)
            this.speed = (50 / this.radius) * 0.05 + Math.random() * 0.002; 
            
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.5 + 0.1;
            
            // 稍微带一点垂直倾斜，形成立体光环感
            this.tilt = Math.random() * 0.4 - 0.2; 
        }

        update() {
            this.angle += this.speed * (config.orbitSpeed * 1000); // 速度受控
        }

        draw() {
            // 简单的 3D 投影效果
            // x = cos, y = sin * 压扁系数
            const x = config.baseX + Math.cos(this.angle) * this.radius;
            const y = config.baseY + Math.sin(this.angle) * this.radius * 0.5 + (Math.sin(this.angle) * this.radius * this.tilt); 
            
            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI*2);
            
            // 深度变暗效果
            const z = Math.sin(this.angle); // 模拟前后
            const alpha = this.alpha * (z > 0 ? 1 : 0.3); // 后面的暗，前面的亮
            
            ctx.fillStyle = config.color; // 跟随主题色
            ctx.globalAlpha = alpha;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    // --- 2. 图像引擎 (静态修正版) ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="1000" height="1000" ');
        }
        return svg;
    }

    function processSource(src) {
        setStatus("读取图像...");
        const img = new Image();
        img.onload = () => {
            setStatus("解析轮廓...");
            const w = 1000; const h = 800;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            cachedImageData = offCtx.getImageData(0,0,w,h).data;
            cachedWidth = w; cachedHeight = h;
            
            resampleImage(); 
            config.scale = (window.innerWidth * config.targetScale) / w; 
            
            if(textParticles.length > 0) setStatus(`生成成功`);
            else setStatus("无内容", true);
        };
        img.onerror = () => setStatus("加载失败", true);
        img.src = src;
    }

    function resampleImage() {
        if (!cachedImageData) return;
        textParticles = [];
        // 密度调节
        const val = parseInt(document.getElementById('densityRange').value);
        const gap = Math.max(2, 9 - val); // 越右越密
        
        const w = cachedWidth; const h = cachedHeight;
        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const lum = (cachedImageData[i] + cachedImageData[i+1] + cachedImageData[i+2])/3;
                if(Math.abs(lum - 128) > 20) {
                    textParticles.push({
                        // ox, oy 是相对于中心的原始坐标
                        ox: x-w/2, 
                        oy: y-h/2,
                        // 记录原始位置，不做波浪干扰
                        x: 0, y: 0 
                    });
                }
            }
        }
    }

    // --- 3. 渲染循环 ---
    function animate() {
        // 拖尾加深，让运动轨迹更明显
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // A. 绘制右旋光环
        ctx.globalCompositeOperation = 'lighter'; // 叠加发光
        orbitParticles.forEach(p => {
            p.update();
            p.draw();
        });

        // B. 绘制文字 (绝对静止/庄严)
        ctx.shadowBlur = config.glow;             
        ctx.shadowColor = config.color;           
        ctx.fillStyle = '#FFFFFF'; // 白核

        textParticles.forEach(p => {
            // 核心修改：移除所有 Math.sin/cos 的波动代码
            // 坐标只受缩放和中心位置影响
            const tx = config.baseX + (p.ox * config.scale);
            const ty = config.baseY + (p.oy * config.scale);
            
            ctx.beginPath();
            ctx.arc(tx, ty, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    // 交互
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { setStatus("请选文件", true); return; }
        const file = input.files[0];
        const r = new FileReader();
        if(file.type.includes('svg')) {
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.updateConfig = function(key, val) {
        if(key === 'zoom') {
            config.targetScale = val / 100;
            document.getElementById('val-zoom').innerText = val + '%';
            if(cachedWidth > 0) config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
        } else {
            config[key] = key === 'color' ? val : parseFloat(val);
        }
    };

    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'h') document.getElementById('ui').classList.toggle('hidden');
    });
    
    // 鼠标滚轮缩放
    window.addEventListener('wheel', e => {
        let currentScale = config.targetScale;
        currentScale += e.deltaY * -0.0005;
        currentScale = Math.min(Math.max(0.1, currentScale), 1.0);
        config.targetScale = currentScale;
        document.getElementById('val-zoom').innerText = Math.round(currentScale*100) + '%';
        if(cachedWidth > 0) config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
    });

    resize();
    initOrbit();
    animate();

</script>
</body>
</html>
