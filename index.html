<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 禁止缓存策略 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Mani - Final Lite</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(10, 20, 30, 0.85); /* 深色背景 */
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 5px 30px rgba(0,0,0,0.5);
        }
        
        .hidden { opacity: 0; pointer-events: none; transform: translateX(-30px); }

        h3 { 
            margin: 0 0 12px 0; color: #00e5ff; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer; font-size: 11px;
            color: white; transition: 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(0,198,255,0.6); }
        
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }

        .control { margin-bottom: 10px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-bottom: 3px; letter-spacing: 1px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00e5ff; height: 2px; }
        input[type="color"] { width: 100%; border: none; height: 20px; padding: 0; background: none; cursor: pointer; }
        input[type="file"] { width: 100%; font-size: 10px; color: #ccc; }

        .hint { font-size: 9px; color: #667; text-align: center; margin-top: 8px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>MANI - FINAL LITE</h3>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
    </div>
    
    <div class="btn-group">
        <button class="btn btn-primary" onclick="runGen()">ACTIVATE / 激活</button>
        <button class="btn btn-secondary" onclick="toggleVortex()">VORTEX / 旋绕</button>
    </div>

    <div style="margin: 12px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <!-- 中景控制 -->
    <div class="control">
        <label>ZOOM / 画面缩放 <span id="val-zoom">45%</span></label>
        <input type="range" min="10" max="100" value="45" oninput="updateConfig('zoom', this.value)">
    </div>

    <div class="control">
        <label>DENSITY / 粒子密度 (性能)</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="2" oninput="resampleImage()">
    </div>

    <div class="control">
        <label>GLOW / 光晕强度</label>
        <input type="range" min="0" max="50" value="25" oninput="updateConfig('glow', this.value)">
    </div>

    <div class="control">
        <label>COLOR / 主题色</label>
        <input type="color" id="colorPicker" value="#00e5ff" oninput="updateConfig('color', this.value)">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<canvas id="canvas"></canvas>
