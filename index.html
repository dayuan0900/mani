<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Bright Neon</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(10, 16, 25, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
            transition: 0.3s;
        }
        
        .hidden { opacity: 0; pointer-events: none; transform: translateX(-30px); }

        h3 { 
            margin: 0 0 15px 0; color: #fff; font-size: 14px; 
            letter-spacing: 3px; text-align: center; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; font-size: 11px;
            color: white; transition: 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(0,198,255,0.6); filter: brightness(1.2); }
        
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-bottom: 4px; letter-spacing: 1px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00e5ff; height: 3px; }
        input[type="color"] { width: 100%; border: none; height: 25px; padding: 0; background: none; cursor: pointer; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }

        .hint { font-size: 9px; color: #667; text-align: center; margin-top: 10px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>BRIGHT NEON</h3>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
    </div>
    
    <div class="btn-group">
        <button class="btn btn-primary" onclick="runGen()">ACTIVATE / 激活</button>
        <button class="btn btn-secondary" onclick="toggleVortex()">🌌 VORTEX / 旋绕</button>
    </div>

    <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <div class="control">
        <label>GLOW / 光晕 (拉大更亮) <span id="val-glow">30</span></label>
        <input type="range" min="0" max="60" value="30" oninput="updateConfig('glow', this.value)">
    </div>

    <div class="control">
        <label>DENSITY / 粒子数量</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="2" oninput="resampleImage()">
    </div>

    <div class="control">
        <label>SIZE / 粒子粗细</label>
        <input type="range" min="0.5" max="3" step="0.1" value="1.0" oninput="updateConfig('pSize', this.value)">
    </div>

    <div class="control">
        <label>COLOR / 霓虹色</label>
        <input type="color" id="colorPicker" value="#00e5ff" oninput="updateConfig('color', this.value)">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let textParticles = [];
    let vortexParticles = [];
    let cachedImageData = null; 
    let cachedWidth = 0;
    let cachedHeight = 0;

    let config = {
        baseX: 0, baseY: 0, scale: 1,
        color: '#00e5ff',
        pSize: 1.0,      
        glow: 30,        
        waveAmp: 6,      
        waveSpeed: 0.002,
        vortexOn: true   
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        initVortex();
    }
    window.addEventListener('resize', resize);

    // --- 1. 背景旋绕系统 ---
    function initVortex() {
        vortexParticles = [];
        const count = 1000;
        for(let i=0; i<count; i++) {
            vortexParticles.push(new VortexParticle());
        }
    }

    class VortexParticle {
        constructor() { this.reset(); }
        reset() {
            this.angle = Math.random() * Math.PI * 2;
            this.radius = Math.random() * (Math.max(canvas.width, canvas.height) * 0.8);
            this.speed = (Math.random() * 0.001 + 0.0005) * (Math.random()>0.5 ? 1 : -1);
            this.size = Math.random() * 2;
            this.alpha = Math.random() * 0.5;
        }
        update() {
            this.angle += this.speed;
            this.radius += Math.sin(Date.now() * 0.001 + this.angle) * 0.2;
        }
        draw() {
            const x = config.baseX + Math.cos(this.angle) * this.radius;
            const y = config.baseY + Math.sin(this.angle) * this.radius * 0.6; 
            
            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI*2);
            const distRatio = Math.min(1, this.radius / (canvas.width/2));
            const alpha = this.alpha * (1 - distRatio) + 0.05;
            // 背景粒子使用淡色，不抢主体风头
            ctx.fillStyle = `rgba(180, 220, 255, ${alpha})`;
            ctx.fill();
        }
    }

    function toggleVortex() {
        config.vortexOn = !config.vortexOn;
        if(config.vortexOn) initVortex();
        else vortexParticles = [];
    }

    // --- 2. 图像引擎 (修正版) ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="2000" height="2000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            const w = 2000; const h = 1500;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            cachedImageData = offCtx.getImageData(0,0,w,h).data;
            cachedWidth = w; cachedHeight = h;
            
            resampleImage(); 
            config.scale = (window.innerWidth * 0.75) / w; 
        };
        img.src = src;
    }

    function resampleImage() {
        if (!cachedImageData) return;
        textParticles = [];
        const gapVal = parseInt(document.getElementById('densityRange').value);
        const gap = Math.max(2, 10 - gapVal * 2); 
        
        const w = cachedWidth; const h = cachedHeight;
        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const lum = (cachedImageData[i] + cachedImageData[i+1] + cachedImageData[i+2])/3;
                if(Math.abs(lum - 128) > 20) {
                    textParticles.push({
                        x: Math.random()*canvas.width,
                        y: Math.random()*canvas.height,
                        ox: x-w/2, oy: y-h/2,
                        vx: 0, vy: 0,
                        offset: (x * 0.01 + y * 0.01)
                    });
                }
            }
        }
    }

    // --- 3. 渲染循环 (高亮修正) ---
    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; // 保持一定拖尾
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const time = Date.now() * 0.001;

        // A. 背景
        if (config.vortexOn) {
            ctx.globalCompositeOperation = 'lighter';
            vortexParticles.forEach(p => { p.update(); p.draw(); });
        }

        // B. 主体文字 (亮核修正)
        ctx.globalCompositeOperation = 'lighter'; // 叠加模式
        ctx.shadowBlur = config.glow;             // 光晕
        ctx.shadowColor = config.color;           // 光晕颜色
        
        // 【关键修改】核心颜色强制为白色 (White Core)
        // 这样无论光晕多大，中心永远最亮，不会变暗
        ctx.fillStyle = '#FFFFFF'; 

        textParticles.forEach(p => {
            const wx = Math.sin(time + p.offset) * config.waveAmp;
            const wy = Math.cos(time * 1.1 + p.offset) * config.waveAmp;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.8; p.vy *= 0.8;

            ctx.beginPath();
            ctx.arc(p.x, p.y, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    // 交互
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请选择图片"); return; }
        const file = input.files[0];
        const r = new FileReader();
        if(file.type.includes('svg')) {
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.updateConfig = function(key, val) {
        config[key] = parseFloat(val);
        if(key === 'glow') document.getElementById('val-glow').innerText = val;
    };
    
    window.toggleVortex = function() {
        config.vortexOn = !config.vortexOn;
        if(config.vortexOn) initVortex();
    };

    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'h') document.getElementById('ui').classList.toggle('hidden');
    });
    
    window.addEventListener('wheel', e => {
        config.scale += e.deltaY * -0.001;
        if(config.scale < 0.1) config.scale = 0.1;
    });

    resize();
    initVortex();
    animate();

</script>
</body>
</html>
