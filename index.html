<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - Nuclear Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        
        #ui {
            position: absolute; top: 10px; left: 10px; width: 260px;
            background: rgba(30, 30, 30, 0.9); border: 1px solid #555;
            padding: 15px; color: #fff; z-index: 100;
        }

        /* 显眼的日志框 */
        #console {
            height: 80px; background: #000; color: #0f0; 
            overflow-y: scroll; border: 1px solid #333; 
            margin-bottom: 10px; padding: 5px; font-size: 10px;
        }

        button {
            width: 100%; padding: 15px; margin-top: 5px; cursor: pointer;
            font-weight: bold; font-size: 14px; border: none;
        }
        .btn-go { background: #00e5ff; color: #000; }
        .btn-go:active { background: #fff; }
        .btn-test { background: #555; color: #fff; font-size: 12px; padding: 8px;}

        input { width: 100%; margin-bottom: 5px; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <div id="console">等待 JS 加载...</div>
    
    <label>1. 上传文件</label>
    <input type="file" id="fInput">
    
    <!-- 使用最原始的 onclick，确保 100% 触发 -->
    <button class="btn-go" onclick="runImage()">⚡ 强制生成 (点击)</button>
    <button class="btn-test" onclick="runTest()">🛠️ 生成测试图</button>
    
    <div style="margin-top:10px; font-size:10px; color:#aaa;">
        粒子大小: <input type="range" id="sz" min="1" max="5" value="3" oninput="cfg.size=this.value">
        光效颜色: <input type="color" value="#00e5ff" oninput="cfg.color=this.value">
    </div>
</div>

<canvas id="c"></canvas>

<script>
    // --- 0. 全局错误捕获 (最优先) ---
    const logBox = document.getElementById('console');
    function log(msg) {
        logBox.innerHTML = "> " + msg + "<br>" + logBox.innerHTML;
        console.log(msg);
    }
    window.onerror = function(msg, url, line) {
        alert("JS 严重错误: " + msg);
        log("ERROR: " + msg);
    };

    log("JS 已加载。准备就绪。");

    // --- 1. 引擎初始化 ---
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    let particles = [];
    let cfg = { color: '#00e5ff', size: 3, w: 0, h: 0 };

    function resize() {
        cfg.w = canvas.width = window.innerWidth;
        cfg.h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- 2. 核心逻辑 (暴露在全局 window 下) ---

    // 绘制测试图
    window.runTest = function() {
        log("正在生成测试图...");
        processData(null, true); // true = 使用内置测试数据
    };

    // 处理图片
    window.runImage = function() {
        // 1. 立即弹窗测试，确保按钮是活的
        log("按钮被点击！开始处理...");
        
        const input = document.getElementById('fInput');
        if (!input.files || !input.files[0]) {
            alert("请先选择图片文件！");
            log("失败: 未选择文件");
            return;
        }

        const file = input.files[0];
        log("读取: " + file.name);
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                processImageObj(img);
            };
            img.onerror = function() {
                alert("图片加载失败 (Image Load Error)");
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    };

    function processImageObj(img) {
        log(`图片尺寸: ${img.width}x${img.height}`);
        
        // 强制离屏渲染
        const w = 800; 
        const h = 600;
        const off = document.createElement('canvas');
        off.width = w; off.height = h;
        const ctx2 = off.getContext('2d');

        // 铺灰底 (关键)
        ctx2.fillStyle = '#808080';
        ctx2.fillRect(0, 0, w, h);

        // 绘制
        const aspect = img.width / img.height || 1;
        let dw = w, dh = w / aspect;
        if(dh > h) { dh = h; dw = h * aspect; }
        ctx2.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);

        // 采样
        const imgData = ctx2.getImageData(0, 0, w, h);
        processData(imgData, false);
    }

    function processData(imgData, isTest) {
        particles = [];
        
        if (isTest) {
            // 生成一个简单的 TEST 矩阵
            for(let y=200; y<400; y+=5) {
                for(let x=200; x<600; x+=5) {
                    particles.push({
                        x: x + (Math.random()-0.5)*2,
                        y: y + (Math.random()-0.5)*2,
                        ox: x, oy: y,
                        vx: 0, vy: 0
                    });
                }
            }
            log("测试粒子已生成");
        } else {
            // 真实的像素扫描
            const data = imgData.data;
            const w = imgData.width;
            const h = imgData.height;
            const gap = 3; 

            for(let y=0; y<h; y+=gap) {
                for(let x=0; x<w; x+=gap) {
                    const i = (y*w + x)*4;
                    const lum = (data[i] + data[i+1] + data[i+2]) / 3;
                    
                    // 边缘检测
                    if(x+gap < w) {
