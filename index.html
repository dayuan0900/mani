<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 禁止 Cloudflare 干扰 -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Deep Space Particles</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        /* 极简磨砂 UI */
        #ui {
            position: absolute; top: 20px; left: 20px; width: 240px;
            background: rgba(10, 10, 15, 0.6); /* 更加通透 */
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 20px; color: #fff; z-index: 100;
            transition: opacity 0.3s;
        }
        
        /* 鼠标悬停显示，平时半透明 */
        #ui:hover { opacity: 1; background: rgba(10, 10, 15, 0.85); }
        #ui { opacity: 0.6; }

        h3 { 
            margin: 0 0 15px 0; color: #fff; font-weight: 300; font-size: 14px;
            letter-spacing: 4px; text-align: center; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }

        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 10px; color: #88a; margin-bottom: 5px; letter-spacing: 1px; }

        /* 科技感按钮 */
        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            background: rgba(0, 229, 255, 0.15);
            color: #00e5ff; font-weight: bold; cursor: pointer;
            border: 1px solid rgba(0, 229, 255, 0.3);
            font-size: 12px; transition: all 0.2s;
        }
        .btn:hover { background: rgba(0, 229, 255, 0.3); box-shadow: 0 0 15px rgba(0,229,255,0.2); }
        .btn:active { transform: scale(0.98); }

        input[type="file"] { font-size: 10px; color: #aaa; width: 100%; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00e5ff; height: 2px; }
        input[type="color"] { width: 100%; border: none; height: 20px; cursor: pointer; background: none; padding: 0; }

        canvas { display: block; }
        
        /* 加载遮罩 */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; 
            justify-content: center; align-items: center; color: #444;
            font-size: 12px; letter-spacing: 2px; transition: opacity 1s; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="loader">INITIALIZING SPACE...</div>

<div id="ui">
    <h3>Star Dust</h3>
    
    <div class="control-group">
        <label>SOURCE FILE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" onclick="runGen()" style="margin-top:5px;">ACTIVATE / 激活</button>
        <button class="btn" onclick="runTest()" style="margin-top:5px; border-color:#444; color:#666; background:transparent;">TEST / 测试</button>
    </div>

    <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.05);"></div>

    <div class="control-group">
        <label>PARTICLE SIZE / 粒子细度</label>
        <input type="range" id="sizeRange" min="0.5" max="3" step="0.1" value="1.2" oninput="config.pSize=parseFloat(this.value)">
    </div>
    
    <div class="control-group">
        <label>FLOW SPEED / 飘动速度</label>
        <input type="range" id="flowRange" min="0" max="50" value="15" oninput="config.waveSpeed=this.value*0.0001">
    </div>

    <div class="control-group">
        <label>THEME COLOR / 极光色</label>
        <input type="color" id="colorPicker" value="#00e5ff" oninput="config.color=this.value">
    </div>
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    // --- 0. 启动 ---
    window.onload = () => {
        document.getElementById('loader').style.opacity = 0;
        resize();
        initDust(); // 初始化星尘
        animate();
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let textParticles = []; // 文字粒子
    let dustParticles = []; // 背景星尘
    let mouse = { x: -1000, y: -1000 };

    let config = {
        baseX: 0, baseY: 0, scale: 1,
        color: '#00e5ff',
        pSize: 1.2, // 默认粒子非常细，显精致
        waveAmp: 10,
        waveSpeed: 0.0015
    };

    // --- 1. 初始化 ---
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        initDust();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    // --- 2. 背景星尘系统 (这才是你要的粒子云) ---
    function initDust() {
        dustParticles = [];
        const count = 300; // 粒子数量多，但个头小
        for(let i=0; i<count; i++) {
            dustParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5, // 细碎的星尘
                vx: (Math.random() - 0.5) * 0.2, // 缓慢漂浮
                vy: (Math.random() - 0.5) * 0.2,
                alpha: Math.random() * 0.5 + 0.1, // 半透明
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    // --- 3. 图像处理核心 (保留了修补SVG的逻辑) ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="1000" height="1000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            // 采样画布
            const w = 1000; const h = 800;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            // 铺灰底
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            // 绘制
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            // 采样
            const data = offCtx.getImageData(0,0,w,h).data;
            textParticles = [];
            const gap = 2; // 采样极密，保证细腻度
            
            for(let y=0; y<h; y+=gap) {
                for(let x=0; x<w; x+=gap) {
                    const i = (y*w+x)*4;
                    const lum = (data[i]+data[i+1]+data[i+2])/3;
                    if(x+gap<w) {
                        const lum2 = (data[i+4*gap]+data[i+4*gap+1]+data[i+4*gap+2])/3;
                        if(Math.abs(lum-lum2) > 20) {
                            textParticles.push({
                                x: Math.random()*canvas.width,
                                y: Math.random()*canvas.height,
                                ox: x-w/2, oy: y-h/2,
                                vx: 0, vy: 0,
                                friction: Math.random()*0.05 + 0.9,
                                offset: Math.random()*100
                            });
                        }
                    }
                }
            }
            if(textParticles.length > 0) config.scale = (window.innerWidth*0.7)/w;
            else alert("未检测到轮廓！");
        };
        img.src = src;
    }

    // --- 4. 交互 ---
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请选择图片"); return; }
        const file = input.files[0];
        
        if(file.type.includes('svg')) {
            const r = new FileReader();
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };
    
    window.runTest = function() {
        const t = document.createElement('canvas'); t.width=600; t.height=300;
        const c = t.getContext('2d'); c.fillStyle="#fff"; c.fillRect(0,0,600,300);
        c.fillStyle="#000"; c.font="bold 120px Arial"; c.fillText("ZEN", 180, 190);
        processSource(t.toDataURL());
    };

    // --- 5. 渲染循环 ---
    function animate() {
        // 拖尾效果：越透明拖尾越长。0.1是长拖尾，0.3是短拖尾
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const time = Date.now();

        // A. 绘制背景星尘 (Particle Cloud)
        ctx.globalCompositeOperation = 'lighter'; // 叠加变亮
        dustParticles.forEach(p => {
            // 自然漂浮
            p.x += p.vx;
            p.y += p.vy;
            
            // 鼠标交互：轻微避让
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 100) {
                p.x -= dx * 0.01;
                p.y -= dy * 0.01;
            }

            // 边界循环
            if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
            if(p.y<0) p.y=canvas.height; if(p.y>canvas.height) p.y=0;

            // 闪烁呼吸
            const flicker = Math.sin(time * 0.002 + p.phase) * 0.2 + p.alpha;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fillStyle = `rgba(100, 200, 255, ${flicker})`; // 淡蓝色星尘
            ctx.fill();
        });

        // B. 绘制文字粒子
        // 设置光晕
        ctx.shadowBlur = 8;
        ctx.shadowColor = config.color;
        ctx.fillStyle = config.color;

        textParticles.forEach(p => {
            // 核心飘动算法
            const wx = Math.sin(time * config.waveSpeed + p.offset) * config.waveAmp;
            const wy = Math.cos(time * config.waveSpeed + p.offset) * config.waveAmp;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.8; p.vy *= 0.8;

            ctx.beginPath();
            // 粒子画成细小的圆，更显精致
            ctx.arc(p.x, p.y, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });

        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
