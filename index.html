<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Final Stable</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(10, 15, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 15px; color: #fff; z-index: 100;
            box-shadow: 0 5px 40px rgba(0,0,0,0.6);
        }
        
        .hidden { opacity: 0; pointer-events: none; transform: translateX(-30px); }

        h3 { 
            margin: 0 0 5px 0; color: #00e5ff; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
        }

        /* 状态显示栏 */
        #status-bar {
            font-size: 10px; color: #0f0; text-align: center; margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer; font-size: 11px;
            color: white; transition: 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .btn-primary:hover { box-shadow: 0 0 10px rgba(0,198,255,0.6); }
        
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }

        .control { margin-bottom: 10px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-bottom: 3px; letter-spacing: 1px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00e5ff; height: 2px; }
        input[type="color"] { width: 100%; border: none; height: 20px; padding: 0; background: none; cursor: pointer; }
        input[type="file"] { width: 100%; font-size: 10px; color: #ccc; }

        .hint { font-size: 9px; color: #667; text-align: center; margin-top: 8px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>MANI - FINAL STABLE</h3>
    <div id="status-bar">等待指令...</div>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
    </div>
    
    <div class="btn-group">
        <button class="btn btn-primary" onclick="runGen()">ACTIVATE / 激活</button>
        <button class="btn btn-secondary" onclick="toggleVortex()">VORTEX / 旋绕</button>
    </div>

    <div style="margin: 12px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <!-- 中景缩放 -->
    <div class="control">
        <label>ZOOM / 缩放 <span id="val-zoom">45%</span></label>
        <input type="range" min="10" max="100" value="45" oninput="updateConfig('zoom', this.value)">
    </div>

    <!-- 密度修复：现在往右拉会非常密 -->
    <div class="control">
        <label>DENSITY / 粒子密度</label>
        <input type="range" id="densityRange" min="1" max="3" step="1" value="2" oninput="resampleImage()">
    </div>

    <div class="control">
        <label>GLOW / 光晕强度</label>
        <input type="range" min="0" max="50" value="25" oninput="updateConfig('glow', this.value)">
    </div>

    <div class="control">
        <label>COLOR / 主题色</label>
        <input type="color" id="colorPicker" value="#00e5ff" oninput="updateConfig('color', this.value)">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    // --- 0. 错误捕获 ---
    const statusEl = document.getElementById('status-bar');
    function setStatus(msg, isError=false) {
        statusEl.innerText = msg;
        statusEl.style.color = isError ? '#ff5555' : '#0f0';
        console.log(msg);
    }
    window.onerror = function(msg) { setStatus("系统错误: " + msg, true); };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let textParticles = [];
    let vortexParticles = [];
    let cachedImageData = null; 
    let cachedWidth = 0;
    let cachedHeight = 0;

    let config = {
        baseX: 0, baseY: 0, 
        scale: 1,        
        targetScale: 0.45, 
        color: '#00e5ff',
        pSize: 1.1,      
        glow: 25,        
        waveAmp: 5,      
        waveSpeed: 0.002,
        vortexOn: true   
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        
        if (cachedWidth > 0) {
            config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
        }
        initVortex();
    }
    window.addEventListener('resize', resize);

    // --- 1. 背景旋绕 (修复可见性) ---
    function initVortex() {
        vortexParticles = [];
        const count = 800; 
        for(let i=0; i<count; i++) {
            vortexParticles.push({
                angle: Math.random() * Math.PI * 2,
                radius: Math.random() * (Math.max(canvas.width, canvas.height) * 0.8),
                speed: (Math.random() * 0.001 + 0.0002) * (Math.random()>0.5 ? 1 : -1),
                size: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.5 + 0.2 // 稍微调亮一点
            });
        }
        setStatus("背景粒子已加载");
    }

    function toggleVortex() {
        config.vortexOn = !config.vortexOn;
        if(config.vortexOn) initVortex();
        else vortexParticles = [];
    }

    // --- 2. 图像引擎 (移除跨域锁) ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="1000" height="1000" ');
        }
        return svg;
    }

    function processSource(src) {
        setStatus("正在读取图像...");
        const img = new Image();
        // 【重要】移除了 img.crossOrigin，这在本地上传时是多余且有害的
        
        img.onload = () => {
            setStatus("图像解析中...");
            const w = 1000; const h = 800;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            // 灰底扫描 (黑白通吃)
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            cachedImageData = offCtx.getImageData(0,0,w,h).data;
            cachedWidth = w; cachedHeight = h;
            
            resampleImage(); 
            config.scale = (window.innerWidth * config.targetScale) / w; 
            
            if(textParticles.length > 0) setStatus(`生成成功: ${textParticles.length} 粒子`);
            else setStatus("未检测到轮廓! 请检查SVG颜色", true);
        };
        img.onerror = () => setStatus("图像加载失败! 格式不支持", true);
        img.src = src;
    }

    function resampleImage() {
        if (!cachedImageData) return;
        textParticles = [];
        const densityLevel = parseInt(document.getElementById('densityRange').value);
        
        // 修正的密度算法：Level 1 -> gap 3; Level 3 -> gap 1 (最密)
        const gap = 4 - densityLevel; 
        
        const w = cachedWidth; const h = cachedHeight;
        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const lum = (cachedImageData[i] + cachedImageData[i+1] + cachedImageData[i+2])/3;
                if(Math.abs(lum - 128) > 20) {
                    textParticles.push({
                        x: Math.random()*canvas.width,
                        y: Math.random()*canvas.height,
                        ox: x-w/2, oy: y-h/2,
                        vx: 0, vy: 0,
                        offset: (x * 0.01 + y * 0.01)
                    });
                }
            }
        }
    }

    // --- 3. 渲染循环 ---
    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const time = Date.now() * 0.001;

        // A. 背景
        if (config.vortexOn) {
            ctx.globalCompositeOperation = 'lighter';
            vortexParticles.forEach(p => {
                p.angle += p.speed;
                p.radius += Math.sin(Date.now()*0.0005 + p.angle)*0.1;
                
                const x = config.baseX + Math.cos(p.angle) * p.radius;
                const y = config.baseY + Math.sin(p.angle) * p.radius * 0.6; // 扁平化
                
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI*2);
                
                // 距离中心越近越亮
                const distRatio = Math.min(1, p.radius / canvas.width);
                const alpha = p.alpha * (1 - distRatio * 0.5);
                ctx.fillStyle = `rgba(180, 220, 255, ${alpha})`;
                ctx.fill();
            });
        }

        // B. 文字
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = config.glow;             
        ctx.shadowColor = config.color;           
        ctx.fillStyle = '#FFFFFF';

        textParticles.forEach(p => {
            const wx = Math.sin(time + p.offset) * config.waveAmp;
            const wy = Math.cos(time * 1.1 + p.offset) * config.waveAmp;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.85; p.vy *= 0.85;

            ctx.beginPath();
            ctx.arc(p.x, p.y, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    // 交互
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { setStatus("请选择图片!", true); return; }
        const file = input.files[0];
        const r = new FileReader();
        if(file.type.includes('svg')) {
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.updateConfig = function(key, val) {
        if(key === 'zoom') {
            config.targetScale = val / 100;
            document.getElementById('val-zoom').innerText = val + '%';
            if(cachedWidth > 0) config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
        } else {
            config[key] = key === 'color' ? val : parseFloat(val);
        }
    };
    
    window.toggleVortex = function() {
        config.vortexOn = !config.vortexOn;
        if(config.vortexOn) initVortex();
        else vortexParticles = [];
    };

    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'h') document.getElementById('ui').classList.toggle('hidden');
    });
    
    window.addEventListener('wheel', e => {
        let currentScale = config.targetScale;
        currentScale += e.deltaY * -0.0005;
        currentScale = Math.min(Math.max(0.1, currentScale), 1.0);
        config.targetScale = currentScale;
        document.getElementById('val-zoom').innerText = Math.round(currentScale*100) + '%';
        if(cachedWidth > 0) config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
    });

    resize();
    initVortex();
    animate();

</script>
</body>
</html>
