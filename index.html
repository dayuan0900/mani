<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Galaxy Vortex</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        /* 界面 UI */
        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(10, 16, 25, 0.75);
            backdrop-filter: blur(15px); /* 更强的磨砂 */
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
            transition: transform 0.3s, opacity 0.3s;
        }
        
        .hidden { opacity: 0; pointer-events: none; transform: translateX(-50px); }

        h3 { 
            margin: 0 0 15px 0; color: #fff; font-size: 14px; 
            letter-spacing: 3px; text-align: center; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,229,255,0.5);
        }

        /* 按钮组 */
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; font-size: 11px;
            color: white; transition: 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(0,198,255,0.5); }
        
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }

        /* 滑块控件 */
        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #88a; margin-bottom: 4px; letter-spacing: 1px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00e5ff; height: 2px; }
        input[type="color"] { width: 100%; border: none; height: 25px; padding: 0; background: none; cursor: pointer; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }

        .hint { font-size: 9px; color: #556; text-align: center; margin-top: 10px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>GALAXY VORTEX</h3>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
    </div>
    
    <div class="btn-group">
        <button class="btn btn-primary" onclick="runGen()">ACTIVATE / 激活</button>
        <button class="btn btn-secondary" onclick="toggleVortex()">🌌 VORTEX / 旋绕云</button>
    </div>

    <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <div class="control">
        <label>GLOW STRENGTH / 光晕强度 <span id="val-glow">20</span></label>
        <input type="range" min="0" max="50" value="20" oninput="updateConfig('glow', this.value)">
    </div>

    <div class="control">
        <label>DENSITY / 粒子数量 (左疏右密)</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="2" oninput="resampleImage()">
    </div>

    <div class="control">
        <label>PARTICLE SIZE / 粒子大小</label>
        <input type="range" min="0.5" max="3" step="0.1" value="1.0" oninput="updateConfig('pSize', this.value)">
    </div>

    <div class="control">
        <label>THEME COLOR / 极光色</label>
        <input type="color" id="colorPicker" value="#00e5ff" oninput="updateConfig('color', this.value)">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面 | 滚轮缩放</div>
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // 全局数据存储
    let textParticles = [];
    let vortexParticles = [];
    let cachedImageData = null; // 缓存图片数据，用于实时调节密度
    let cachedWidth = 0;
    let cachedHeight = 0;

    let config = {
        baseX: 0, baseY: 0, scale: 1,
        color: '#00e5ff',
        pSize: 1.0,      // 粒子大小
        glow: 20,        // 光晕强度
        waveAmp: 6,      // 飘动幅度
        waveSpeed: 0.002,
        vortexOn: true   // 背景旋绕开关
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        initVortex();
    }
    window.addEventListener('resize', resize);

    // --- 1. 旋绕粒子云系统 (Vortex System) ---
    function initVortex() {
        vortexParticles = [];
        const count = 1200; // 粒子数量
        for(let i=0; i<count; i++) {
            vortexParticles.push(new VortexParticle());
        }
    }

    class VortexParticle {
        constructor() {
            this.reset();
        }
        reset() {
            // 随机分布在屏幕中心周围
            this.angle = Math.random() * Math.PI * 2;
            this.radius = Math.random() * (Math.max(canvas.width, canvas.height) * 0.8);
            this.speed = (Math.random() * 0.002 + 0.0005) * (Math.random()>0.5 ? 1 : -1); // 旋转速度
            this.size = Math.random() * 2;
            this.alpha = Math.random() * 0.5;
            this.z = Math.random(); // 模拟深度
        }
        update() {
            this.angle += this.speed;
            // 稍微改变半径，产生呼吸感
            this.radius += Math.sin(Date.now() * 0.001 + this.angle) * 0.2;
        }
        draw() {
            const x = config.baseX + Math.cos(this.angle) * this.radius;
            const y = config.baseY + Math.sin(this.angle) * this.radius * 0.6; // 0.6 压扁一点，形成3D盘状感
            
            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI*2);
            // 距离中心越近越亮
            const distRatio = Math.min(1, this.radius / (canvas.width/2));
            const alpha = this.alpha * (1 - distRatio) + 0.1;
            
            ctx.fillStyle = `rgba(200, 230, 255, ${alpha})`;
            ctx.fill();
        }
    }

    function toggleVortex() {
        config.vortexOn = !config.vortexOn;
        // 如果开启，重新初始化一下位置，更有动感
        if(config.vortexOn) initVortex();
        else vortexParticles = [];
    }

    // --- 2. 图像引擎 (支持实时重采样) ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="2000" height="2000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            const w = 2000; const h = 1500;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            // 保存原始数据，供调节密度使用
            cachedImageData = offCtx.getImageData(0,0,w,h).data;
            cachedWidth = w;
            cachedHeight = h;
            
            // 第一次生成
            resampleImage(); 
            
            // 自动缩放
            config.scale = (window.innerWidth * 0.75) / w; 
        };
        img.src = src;
    }

    // 根据密度滑块重新生成粒子
    function resampleImage() {
        if (!cachedImageData) return;
        
        textParticles = [];
        const gapVal = parseInt(document.getElementById('densityRange').value);
        // 滑块 1(疏) -> gap 8; 滑块 5(密) -> gap 2
        const gap = Math.max(2, 10 - gapVal * 2); 
        
        const w = cachedWidth;
        const h = cachedHeight;
        
        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const lum = (cachedImageData[i] + cachedImageData[i+1] + cachedImageData[i+2])/3;
                
                // 灰度差检测
                if(Math.abs(lum - 128) > 20) {
                    textParticles.push({
                        x: Math.random()*canvas.width,
                        y: Math.random()*canvas.height,
                        ox: x-w/2, oy: y-h/2,
                        vx: 0, vy: 0,
                        offset: (x * 0.01 + y * 0.01)
                    });
                }
            }
        }
    }

    // --- 3. 渲染循环 ---
    function animate() {
        // 拖尾效果
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const time = Date.now() * 0.001;

        // A. 绘制背景旋绕云
        if (config.vortexOn) {
            ctx.globalCompositeOperation = 'lighter';
            vortexParticles.forEach(p => {
                p.update();
                p.draw();
            });
        }

        // B. 绘制文字 (带可调光晕)
        ctx.globalCompositeOperation = 'lighter'; // 关键：高亮叠加
        ctx.shadowBlur = config.glow;             // 关键：光晕强度
        ctx.shadowColor = config.color;
        ctx.fillStyle = config.color;

        textParticles.forEach(p => {
            const wx = Math.sin(time + p.offset) * config.waveAmp;
            const wy = Math.cos(time * 1.1 + p.offset) * config.waveAmp;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.8; p.vy *= 0.8;

            ctx.beginPath();
            ctx.arc(p.x, p.y, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    // --- 交互绑定 ---
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请先选择图片"); return; }
        const file = input.files[0];
        
        if(file.type.includes('svg')) {
            const r = new FileReader();
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.updateConfig = function(key, val) {
        config[key] = parseFloat(val);
        if(key === 'glow') document.getElementById('val-glow').innerText = val;
    };

    // 快捷键隐藏UI
    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'h') document.getElementById('ui').classList.toggle('hidden');
    });
    
    // 滚轮缩放
    window.addEventListener('wheel', e => {
        config.scale += e.deltaY * -0.001;
        if(config.scale < 0.1) config.scale = 0.1;
    });

    // 启动
    resize();
    initVortex();
    animate();

</script>
</body>
</html>
