<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Hi-Res Stardust</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        /* 极简半透明 UI */
        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 20px; color: #fff; z-index: 100;
        }
        
        /* 鼠标移开时变淡，避免干扰视线 */
        #ui:hover { opacity: 1; }
        #ui { opacity: 0.5; transition: opacity 0.3s; }

        h3 { 
            margin: 0 0 15px 0; color: #fff; font-size: 14px; 
            letter-spacing: 3px; text-align: center; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
        }

        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff; font-size: 12px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            margin-top: 8px; transition: 0.2s;
        }
        .btn:hover { background: rgba(0, 229, 255, 0.3); border-color: #00e5ff; }

        label { display: block; font-size: 10px; color: #888; margin-top: 10px; margin-bottom: 4px; letter-spacing: 1px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #aaa; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #fff; height: 2px; }
        input[type="color"] { width: 100%; border: none; height: 20px; background: none; padding: 0; }

        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>High-Fidelity</h3>
    
    <input type="file" id="imageInput" accept="image/*,.svg">
    <button class="btn" onclick="runGen()">ACTIVATE / 激活高清粒子</button>
    <button class="btn" onclick="runTest()" style="border-style:dashed; color:#888;">TEST / 测试图</button>

    <div style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.1);"></div>

    <label>PARTICLE SIZE / 粒子粗细 (调小更清晰)</label>
    <input type="range" id="sizeRange" min="0.5" max="3" step="0.1" value="0.8" oninput="config.pSize=parseFloat(this.value)">

    <label>WAVE FLOW / 飘动幅度</label>
    <input type="range" id="waveRange" min="0" max="30" value="5" oninput="config.waveAmp=parseFloat(this.value)">

    <label>COLOR / 颜色</label>
    <input type="color" id="colorPicker" value="#00e5ff" oninput="config.color=this.value">
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    // --- 0. 启动 ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let particles = [];
    let bgStars = [];
    
    let config = {
        baseX: 0, baseY: 0, scale: 1,
        color: '#00e5ff',
        pSize: 0.8,      // 【关键】默认极细，像沙子一样
        waveAmp: 5,      // 【关键】默认飘动幅度小，防止变形
        waveSpeed: 0.002
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        initBg();
    }
    window.addEventListener('resize', resize);
    
    // --- 1. 背景星海 (深邃感) ---
    function initBg() {
        bgStars = [];
        for(let i=0; i<400; i++) {
            bgStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.2
            });
        }
    }

    // --- 2. 核心：高保真图像处理 ---
    function patchSVG(svg) {
        // 强行把 SVG 内部尺寸撑大，确保不模糊
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="2000" height="2000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            // 【关键升级】使用 2000px 宽度的画布进行采样，相当于 2K/4K 分辨率
            const w = 2000; 
            const h = 1500;
            
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            // 铺灰底
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            // 居中绘制
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            // 采样
            const data = offCtx.getImageData(0,0,w,h).data;
            particles = [];
            
            // 【关键升级】采样步长 (Gap)
            // 画布大了，gap 可以稍微大一点 (4)，这样粒子总数可控，但位置极其精准
            const gap = 4; 
            
            for(let y=0; y<h; y+=gap) {
                for(let x=0; x<w; x+=gap) {
                    const i = (y*w+x)*4;
                    const lum = (data[i]+data[i+1]+data[i+2])/3;
                    
                    // 边缘检测 + 内部填充检测
                    if(x+gap < w) {
                        const lum2 = (data[i+4*gap]+data[i+4*gap+1]+data[i+4*gap+2])/3;
                        // 阈值调低，捕捉更多细节
                        if(Math.abs(lum-lum2) > 15) {
                            particles.push({
                                x: Math.random()*canvas.width,
                                y: Math.random()*canvas.height,
                                ox: (x-w/2), 
                                oy: (y-h/2),
                                vx: 0, vy: 0,
                                // 赋予一点随机大小，让它像星星一样自然
                                size: Math.random() * 0.5 + 0.5, 
                                offset: Math.random()*100
                            });
                        }
                    }
                }
            }
            
            if(particles.length > 0) {
                // 根据屏幕大小计算缩放，确保文字完整显示
                config.scale = (window.innerWidth * 0.7) / w; 
            } else {
                alert("未检测到内容，请检查图片！");
            }
        };
        img.src = src;
    }

    // --- 3. 交互 ---
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请选择文件"); return; }
        const file = input.files[0];
        
        if(file.type.includes('svg')) {
            const r = new FileReader();
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.runTest = function() {
        const t = document.createElement('canvas'); t.width=1000; t.height=500;
        const c = t.getContext('2d'); c.fillStyle="#fff"; c.fillRect(0,0,1000,500);
        c.fillStyle="#000"; c.font="bold 150px Arial"; c.fillText("ZEN MODE", 150, 280);
        processSource(t.toDataURL());
    };

    // --- 4. 渲染循环 ---
    function animate() {
        // 1. 拖尾清除 (制造流动感)
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const time = Date.now();

        // 2. 绘制背景星尘
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        bgStars.forEach(s => {
            s.y -= s.speed;
            if(s.y < 0) s.y = canvas.height;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
            ctx.fill();
        });

        // 3. 绘制文字粒子 (核心)
        // 使用 lighter 模式，但控制光晕，让中心锐利
        ctx.globalCompositeOperation = 'lighter'; 
        ctx.fillStyle = config.color;
        
        // 只有当用户真的把滑块拉大时才开启模糊光晕，默认保持锐利
        if (config.pSize > 2) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = config.color;
        } else {
            ctx.shadowBlur = 0;
        }

        particles.forEach(p => {
            // 飘动算法 (幅度由 waveAmp 控制)
            const wx = Math.sin(time * config.waveSpeed + p.offset) * config.waveAmp;
            const wy = Math.cos(time * config.waveSpeed + p.offset) * config.waveAmp;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.8; p.vy *= 0.8;

            ctx.beginPath();
            // 实际绘制大小 = 基础大小 * 随机微调
            ctx.arc(p.x, p.y, config.pSize * p.size, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    // 启动
    resize();
    initBg();
    animate();

</script>
</body>
</html>
