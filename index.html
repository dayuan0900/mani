<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 禁止 Cloudflare Rocket Loader 干扰 -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani Mantra - Nebula Particles</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        /* 界面 UI */
        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(20, 30, 40, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px; color: #fff; z-index: 100;
            transition: opacity 0.5s, transform 0.5s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hidden { opacity: 0; pointer-events: none; transform: translateY(-20px); }

        h3 { 
            margin: 0 0 20px 0; color: #00e5ff; font-weight: 300; 
            letter-spacing: 4px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,229,255,0.4);
        }

        label { display: block; font-size: 11px; color: #88a; margin-bottom: 8px; letter-spacing: 1px; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white; font-weight: bold; cursor: pointer;
            margin-top: 10px; font-size: 13px; letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5); }
        .btn:active { transform: translateY(0); }

        input[type="file"] { font-size: 11px; color: #aaa; width: 100%; margin-bottom: 15px; }
        input[type="range"] { width: 100%; margin-bottom: 15px; cursor: pointer; accent-color: #00e5ff; }
        input[type="color"] { width: 100%; border: none; height: 30px; cursor: pointer; background: none; padding: 0; }

        .hint { font-size: 10px; color: #556; text-align: center; margin-top: 15px; }
        
        canvas { display: block; }
        
        /* 加载状态覆盖层 */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; 
            justify-content: center; align-items: center; color: #00e5ff;
            font-family: monospace; transition: opacity 1s; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="loader">SYSTEM INITIALIZING...</div>

<div id="ui">
    <h3>Nebula Flow</h3>
    
    <label>IMAGE SOURCE</label>
    <input type="file" id="imageInput" accept="image/*,.svg">
    
    <button class="btn" onclick="runGen()">ACTIVATE / 激活</button>
    <button class="btn" style="background:#334; color:#aaa; margin-top:5px; font-size:11px;" onclick="runTest()">TEST IMAGE / 测试</button>
    
    <div style="margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <label>PARTICLE SIZE / 粒子大小</label>
    <input type="range" id="sizeRange" min="1" max="5" step="0.5" value="2.5" oninput="config.pSize=parseFloat(this.value)">

    <label>THEME COLOR / 主题色</label>
    <input type="color" id="colorPicker" value="#00e5ff" oninput="config.color=this.value">

    <div class="hint">按 <b>H</b> 键隐藏/显示界面</div>
</div>

<canvas id="canvas"></canvas>

<!-- 加上 data-cfasync="false" 防止 Cloudflare 压缩脚本 -->
<script data-cfasync="false">
    // --- 0. 启动画面 ---
    window.onload = function() {
        const loader = document.getElementById('loader');
        loader.style.opacity = 0;
        setTimeout(() => loader.remove(), 1000);
        resize();
        initNebula();
        animate();
    };

    // --- 1. 核心变量 ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let nebula = [];
    let config = {
        baseX: window.innerWidth/2, baseY: window.innerHeight/2, 
        scale: 1, color: '#00e5ff', pSize: 2.5
    };

    // --- 2. 初始化 ---
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
    }
    window.addEventListener('resize', resize);

    function initNebula() {
        nebula = [];
        for(let i=0; i<40; i++) {
            nebula.push({
                x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
                r: Math.random()*200+50,
                vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
                hue: Math.random()>0.5 ? 200:260, alpha: 0
            });
        }
    }

    // --- 3. 关键修复：SVG 尺寸修补器 ---
    // 这是让你的 SVG 在服务器上也能显示的救命代码
    function patchSVG(svgContent) {
        // 如果SVG代码里没有width/height，强行插入 1000px
        if (!svgContent.includes('width=') || !svgContent.includes('height=')) {
            return svgContent.replace('<svg', '<svg width="1000" height="1000" ');
        }
        return svgContent;
    }

    // --- 4. 图像引擎 ---
    function processImageObj(img) {
        const w = 800; const h = 600;
        const off = document.createElement('canvas');
        off.width = w; off.height = h;
        const offCtx = off.getContext('2d');
        
        // 铺灰底 (解决透明/黑白问题)
        offCtx.fillStyle = '#808080';
        offCtx.fillRect(0,0,w,h);
        
        const aspect = img.width/img.height||1;
        let dw=w, dh=w/aspect;
        if(dh>h){ dh=h; dw=h*aspect; }
        offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
        
        const data = offCtx.getImageData(0,0,w,h).data;
        particles = [];
        const gap = 3;
        
        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const lum = (data[i]+data[i+1]+data[i+2])/3;
                if(x+gap<w) {
                    const lum2 = (data[i+4*gap]+data[i+4*gap+1]+data[i+4*gap+2])/3;
                    if(Math.abs(lum-lum2) > 20) {
                        particles.push({
                            x: Math.random()*canvas.width,
                            y: Math.random()*canvas.height,
                            ox: x-w/2, oy: y-h/2,
                            vx:0, vy:0, offset: Math.random()*100
                        });
                    }
                }
            }
        }
        if(particles.length > 0) {
            config.scale = (window.innerWidth*0.8)/w;
        } else {
            alert("未检测到轮廓！请尝试使用测试按钮，或更换 PNG 图片。");
        }
    }

    // --- 5. 交互逻辑 (暴露给 window) ---
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请先选择图片"); return; }
        
        const file = input.files[0];
        
        // 特殊处理 SVG：先读文本，修补尺寸，再转图片
        if(file.type.indexOf('svg') > -1) {
            const reader = new FileReader();
            reader.readAsText(file);
            reader.onload = function(e) {
                const fixedSVG = patchSVG(e.target.result);
                const blob = new Blob([fixedSVG], {type: 'image/svg+xml'});
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => processImageObj(img);
                img.src = url;
            };
        } else {
            // 普通图片
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.onload = () => processImageObj(img);
                img.src = e.target.result;
            };
        }
    };

    window.runTest = function() {
        const t = document.createElement('canvas');
        t.width=600; t.height=300;
        const c = t.getContext('2d');
        c.fillStyle="#fff"; c.fillRect(0,0,600,300);
        c.fillStyle="#000"; c.font="bold 100px Arial"; c.fillText("TEST", 150, 180);
        
        const img = new Image();
        img.onload = () => processImageObj(img);
        img.src = t.toDataURL();
    };

    // 按 H 隐藏 UI
    window.addEventListener('keydown', (e) => {
        if(e.key.toLowerCase() === 'h') document.getElementById('ui').classList.toggle('hidden');
    });

    // --- 6. 渲染循环 ---
    function animate() {
        // 拖尾
        ctx.fillStyle = 'rgba(2,2,5,0.2)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        const time = Date.now() * 0.002;

        // 星云
        ctx.globalCompositeOperation = 'lighter';
        nebula.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
            if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
            if(p.alpha<0.1) p.alpha+=0.0005;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
            g.addColorStop(0, `hsla(${p.hue}, 80%, 60%, ${p.alpha})`);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle=g; ctx.fill();
        });

        // 粒子
        ctx.shadowBlur = 10; ctx.shadowColor = config.color;
        ctx.fillStyle = config.color;
        
        particles.forEach(p => {
            const wx = Math.sin(time + p.offset) * 5; 
            const wy = Math.cos(time + p.offset) * 5;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.8; p.vy *= 0.8;

            ctx.beginPath();
            ctx.arc(p.x, p.y, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

</script>
</body>
</html>
