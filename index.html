<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Universal Liquid</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(15, 20, 25, 0.9);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        h3 { margin: 0 0 15px 0; color: #00e5ff; letter-spacing: 2px; text-align: center; }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff; font-weight: bold; cursor: pointer;
            margin-top: 10px; transition: 0.2s;
        }
        .btn:hover { box-shadow: 0 0 20px rgba(0, 198, 255, 0.5); }

        label { display: block; font-size: 11px; color: #88a; margin-top: 12px; margin-bottom: 4px; }
        input[type="file"] { width: 100%; font-size: 11px; color: #ccc; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00e5ff; }
        input[type="color"] { width: 100%; height: 25px; border: none; background: none; }

        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>LIQUID NEON</h3>
    
    <input type="file" id="imageInput" accept="image/*,.svg">
    <button class="btn" onclick="runGen()">ACTIVATE / 激活</button>
    
    <div style="margin-top:15px; border-top:1px solid #333;"></div>

    <label>DENSITY / 连贯密度 (最右最连贯)</label>
    <input type="range" id="densityRange" min="1" max="3" step="1" value="3" oninput="updateDensity(this.value)">

    <label>PARTICLE SIZE / 粒子粗细</label>
    <input type="range" id="sizeRange" min="1" max="4" step="0.1" value="1.5" oninput="config.pSize=parseFloat(this.value)">

    <label>COLOR / 颜色</label>
    <input type="color" id="colorPicker" value="#00e5ff" oninput="config.color=this.value">
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let particles = [];
    let bgParticles = [];
    let currentImgData = null; 
    let currentImgWidth = 0; 
    let currentImgHeight = 0;

    let config = {
        baseX: 0, baseY: 0, scale: 1,
        color: '#00e5ff',
        pSize: 1.5,
        waveAmp: 5,
        waveSpeed: 0.002
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        initBg();
    }
    window.addEventListener('resize', resize);

    // --- 1. 背景星尘 ---
    function initBg() {
        bgParticles = [];
        for(let i=0; i<250; i++) {
            bgParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                alpha: Math.random() * 0.5 + 0.1,
                vx: (Math.random()-0.5) * 0.2,
                vy: (Math.random()-0.5) * 0.2
            });
        }
    }

    // --- 2. 图像处理 (灰色扫描法) ---
    
    // 强制给SVG加尺寸，防止0x0错误
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="1000" height="1000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            const w = 1000; const h = 800; // 强制大尺寸采样
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            // 【关键修改】背景涂成中性灰 #808080 (RGB: 128,128,128)
            // 这样无论是白字还是黑字，都有对比度
            offCtx.fillStyle = '#808080'; 
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            // 居中绘制
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            currentImgData = offCtx.getImageData(0,0,w,h).data;
            currentImgWidth = w;
            currentImgHeight = h;
            
            generateParticles();
        };
        img.onerror = () => alert("图片加载失败，请检查文件格式");
        img.src = src;
    }

    function generateParticles() {
        if (!currentImgData) return;
        
        particles = [];
        const w = currentImgWidth;
        const h = currentImgHeight;
        const gap = 4 - parseInt(document.getElementById('densityRange').value); 

        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const r = currentImgData[i];
                const g = currentImgData[i+1];
                const b = currentImgData[i+2];
                
                const lum = (r + g + b) / 3;
                
                // 【核心逻辑】只要亮度不是 128 (灰色背景)，就说明这里有内容
                // 阈值设为 20，容错率高
                if (Math.abs(lum - 128) > 20) {
                    particles.push({
                        x: Math.random()*canvas.width,
                        y: Math.random()*canvas.height,
                        ox: (x - w/2) + (Math.random()-0.5), // 随机填缝
                        oy: (y - h/2) + (Math.random()-0.5),
                        vx: 0, vy: 0,
                        offset: Math.random()*100
                    });
                }
            }
        }
        
        if(particles.length > 0) {
            config.scale = (window.innerWidth * 0.75) / w; 
        } else {
            alert("未检测到轮廓！请尝试换一张图片，或把SVG转成PNG上传。");
        }
    }

    // --- 3. 交互 ---
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请选择文件"); return; }
        const file = input.files[0];
        
        if(file.type.includes('svg')) {
            const r = new FileReader();
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.updateDensity = function() { generateParticles(); };

    // --- 4. 渲染循环 ---
    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const time = Date.now();

        // 绘制星尘
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        bgParticles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
            if(p.y<0) p.y=canvas.height; if(p.y>canvas.height) p.y=0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });

        // 绘制文字 (Lighter 融合模式)
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = config.color;
        
        // 开启光晕胶水
        ctx.shadowBlur = 10;
        ctx.shadowColor = config.color;

        particles.forEach(p => {
            const wx = Math.sin(time * config.waveSpeed + p.offset) * config.waveAmp;
            const wy = Math.cos(time * config.waveSpeed + p.offset) * config.waveAmp;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.85; p.vy *= 0.85;

            ctx.beginPath();
            ctx.arc(p.x, p.y, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    resize();
    initBg();
    animate();

</script>
</body>
</html>
