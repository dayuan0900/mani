<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Liquid Light</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(10, 15, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        h3 { 
            margin: 0 0 15px 0; color: #fff; font-size: 14px; 
            letter-spacing: 3px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,200,255,0.5);
        }

        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff; font-weight: bold; cursor: pointer;
            margin-top: 8px; transition: 0.2s; font-size: 12px;
        }
        .btn:hover { box-shadow: 0 0 15px rgba(0,198,255,0.4); }

        label { display: block; font-size: 10px; color: #88a; margin-top: 12px; margin-bottom: 4px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #ccc; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00e5ff; }
        input[type="color"] { width: 100%; border: none; height: 25px; padding: 0; background: none; }

        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>LIQUID LIGHT</h3>
    
    <input type="file" id="imageInput" accept="image/*,.svg">
    <button class="btn" onclick="runGen()">ACTIVATE / 激活</button>
    
    <div style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.1);"></div>

    <label>DENSITY / 连贯密度 (关键)</label>
    <input type="range" id="densityRange" min="1" max="3" step="1" value="3" oninput="updateDensity(this.value)">
    <div style="font-size:9px; color:#555; text-align:right;">(拉到最右最连贯)</div>

    <label>PARTICLE SIZE / 粒子大小</label>
    <input type="range" id="sizeRange" min="1" max="4" step="0.1" value="1.8" oninput="config.pSize=parseFloat(this.value)">

    <label>COLOR / 光色</label>
    <input type="color" id="colorPicker" value="#00e5ff" oninput="config.color=this.value">
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let particles = [];
    let bgParticles = [];
    let currentImgData = null; // 缓存图片数据以便重新生成
    let currentImgWidth = 0;
    let currentImgHeight = 0;

    let config = {
        baseX: 0, baseY: 0, scale: 1,
        color: '#00e5ff',
        pSize: 1.8,      // 默认大小适中，配合高密度
        waveAmp: 5,      // 飘动幅度
        waveSpeed: 0.002,
        densityLevel: 1  // 1=逐像素(最密), 3=稀疏
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        initBg();
    }
    window.addEventListener('resize', resize);

    // --- 1. 背景星尘 (深邃氛围) ---
    function initBg() {
        bgParticles = [];
        for(let i=0; i<200; i++) {
            bgParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                alpha: Math.random() * 0.5 + 0.1,
                vx: (Math.random()-0.5) * 0.2,
                vy: (Math.random()-0.5) * 0.2
            });
        }
    }

    // --- 2. 图像引擎 (连贯性核心) ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="1000" height="1000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            // 使用 1200px 宽度的画布，保证细节足够
            const w = 1200; 
            const h = 900;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            offCtx.fillStyle = '#000000'; // 黑底，方便算亮度
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            // 缓存数据
            currentImgData = offCtx.getImageData(0,0,w,h).data;
            currentImgWidth = w;
            currentImgHeight = h;
            
            generateParticles(); // 生成粒子
        };
        img.src = src;
    }

    function generateParticles() {
        if (!currentImgData) return;
        
        particles = [];
        const w = currentImgWidth;
        const h = currentImgHeight;
        
        // **关键逻辑：密度反转**
        // 滑块 3 (最右) -> gap = 1 (最密)
        // 滑块 1 (最左) -> gap = 3 (较疏)
        const userDensity = parseInt(document.getElementById('densityRange').value);
        const gap = 4 - userDensity; 

        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                // 检测亮度 (R+G+B)/3
                const lum = (currentImgData[i] + currentImgData[i+1] + currentImgData[i+2]) / 3;
                
                // 只有亮度足够的地方才生成粒子
                if (lum > 50) {
                    // **关键优化：边缘补点**
                    // 如果这是边缘，必定生成；如果是内部，也生成。
                    // 并且加入 random 偏移，填补 grid 缝隙
                    particles.push({
                        x: Math.random()*canvas.width, // 初始位置随机
                        y: Math.random()*canvas.height,
                        ox: (x - w/2) + (Math.random()-0.5)*1.5, // 目标位置加一点点抖动，消除网格感
                        oy: (y - h/2) + (Math.random()-0.5)*1.5,
                        vx: 0, vy: 0,
                        offset: Math.random()*100 // 飘动相位
                    });
                }
            }
        }
        
        if(particles.length > 0) {
            config.scale = (window.innerWidth * 0.75) / w; 
        } else {
            alert("未检测到内容，请上传白线黑底或透明图！");
        }
    }

    // --- 3. 交互 ---
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请选择文件"); return; }
        const file = input.files[0];
        
        if(file.type.includes('svg')) {
            const r = new FileReader();
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.updateDensity = function(val) {
        generateParticles(); // 拖动密度滑块时实时重新生成
    }

    // --- 4. 渲染循环 ---
    function animate() {
        // 拖尾清除，保留光感
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const time = Date.now();

        // 绘制背景星尘
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        bgParticles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
            if(p.y<0) p.y=canvas.height; if(p.y>canvas.height) p.y=0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });

        // 绘制文字 (高亮叠加模式)
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = config.color;
        
        // 开启光晕，起到“胶水”的作用，把粒子粘在一起
        ctx.shadowBlur = 10;
        ctx.shadowColor = config.color;

        particles.forEach(p => {
            // 波浪飘动
            const wx = Math.sin(time * config.waveSpeed + p.offset) * config.waveAmp;
            const wy = Math.cos(time * config.waveSpeed + p.offset) * config.waveAmp;
            
            const tx = config.baseX + (p.ox * config.scale) + wx;
            const ty = config.baseY + (p.oy * config.scale) + wy;
            
            p.vx += (tx - p.x) * 0.1;
            p.vy += (ty - p.y) * 0.1;
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.85; p.vy *= 0.85;

            ctx.beginPath();
            ctx.arc(p.x, p.y, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    resize();
    initBg();
    animate();

</script>
</body>
</html>
