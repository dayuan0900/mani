<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani - 3D Galaxy Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', monospace; }
        
        #ui {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,200,0,0.15);
            border-radius: 12px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }

        h3 { 
            margin: 0 0 15px 0; color: #ffca28; font-size: 14px; 
            letter-spacing: 3px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,160,0,0.5);
        }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 4px;
            background: linear-gradient(135deg, #ffca28, #ff6f00);
            color: #000; font-weight: bold; cursor: pointer;
            margin-top: 5px; font-size: 12px; letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 20px rgba(255,140,0,0.4); }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-bottom: 4px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffca28; height: 3px; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }
        input[type="color"] { width: 100%; border: none; height: 25px; background: none; cursor: pointer; padding: 0; }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 10px; }
        
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex;
            justify-content: center; align-items: center; color: #ffca28;
            font-size: 12px; letter-spacing: 2px; transition: opacity 0.5s;
        }
    </style>
    
    <!-- 引入 Three.js 引擎 (使用模块化 CDN) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="loading">INITIALIZING 3D ENGINE...</div>

<div id="ui">
    <h3>3D GALAXY CORE</h3>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" id="btnGen">ACTIVATE / 激活法座</button>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;"></div>

    <div class="control">
        <label>GALAXY SIZE / 星系范围</label>
        <input type="range" id="galaxySize" min="10" max="50" value="25" step="1">
    </div>

    <div class="control">
        <label>TEXT SIZE / 文字大小</label>
        <input type="range" id="textSize" min="0.5" max="3" value="1.5" step="0.1">
    </div>

    <div class="control">
        <label>GALAXY DENSITY / 星系粒子数 (最高10万)</label>
        <input type="range" id="galaxyCount" min="10000" max="100000" value="50000" step="5000">
    </div>

    <div class="control">
        <label>CORE COLOR / 核心颜色</label>
        <input type="color" id="colorInside" value="#ff6030">
    </div>
    
    <div class="control">
        <label>EDGE COLOR / 边缘颜色</label>
        <input type="color" id="colorOutside" value="#1b3984">
    </div>

    <div class="hint">左键旋转 | 右键平移 | 滚轮缩放</div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- 1. 场景初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02); // 远处雾化

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 30); // 俯视角度

    const renderer = new THREE.WebGLRenderer({ antialias: false }); // Bloom 不需要抗锯齿
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    // 控制器
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // 后处理 (Bloom 发光)
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0;
    bloomPass.strength = 1.2; // 发光强度
    bloomPass.radius = 0.5;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- 2. 变量定义 ---
    let galaxyGeometry = null;
    let galaxyMaterial = null;
    let galaxyPoints = null;
    
    let textGeometry = null;
    let textMaterial = null;
    let textPoints = null;

    const parameters = {
        count: 50000,
        size: 0.02,
        radius: 25,
        branches: 3,
        spin: 1,
        randomness: 0.2,
        randomnessPower: 3,
        insideColor: '#ff6030',
        outsideColor: '#1b3984'
    };

    // --- 3. 星系生成器 (仿照参考图) ---
    function generateGalaxy() {
        if (galaxyPoints !== null) {
            galaxyGeometry.dispose();
            galaxyMaterial.dispose();
            scene.remove(galaxyPoints);
        }

        galaxyGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(parameters.count * 3);
        const colors = new Float32Array(parameters.count * 3);

        const colorInside = new THREE.Color(parameters.insideColor);
        const colorOutside = new THREE.Color(parameters.outsideColor);

        for (let i = 0; i < parameters.count; i++) {
            const i3 = i * 3;

            // 核心算法：生成螺旋盘
            const radius = Math.random() * parameters.radius;
            const spinAngle = radius * parameters.spin;
            const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;

            const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
            const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
            const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            positions[i3 + 1] = randomY * 2; // 稍微压扁 Y 轴，形成厚度
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            // 颜色混合
            const mixedColor = colorInside.clone();
            mixedColor.lerp(colorOutside, radius / parameters.radius);

            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        galaxyMaterial = new THREE.PointsMaterial({
            size: parameters.size,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending, // 关键：发光叠加
            vertexColors: true
        });

        galaxyPoints = new THREE.Points(galaxyGeometry, galaxyMaterial);
        scene.add(galaxyPoints);
    }

    // --- 4. 文字粒子生成器 (3D版) ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="2000" height="2000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.onload = () => {
            const w = 1500; const h = 1000;
            const canvas2d = document.createElement('canvas');
            canvas2d.width = w; canvas2d.height = h;
            const ctx2d = canvas2d.getContext('2d');
            
            ctx2d.fillStyle = '#000000'; // 黑底
            ctx2d.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            const drawW = w; const drawH = w/aspect;
            ctx2d.drawImage(img, (w-drawW)/2, (h-drawH)/2, drawW, drawH);
            
            const data = ctx2d.getImageData(0,0,w,h).data;
            const points = [];
            const gap = 3; // 采样密度

            for(let y=0; y<h; y+=gap) {
                for(let x=0; x<w; x+=gap) {
                    const i = (y*w+x)*4;
                    // 亮度检测
                    if ((data[i] + data[i+1] + data[i+2])/3 > 50) {
                        points.push({
                            x: (x - w/2) / 30, // 缩放到 3D 空间
                            y: -(y - h/2) / 30, // Y轴反转
                            z: (Math.random() - 0.5) * 0.5 // 稍微一点厚度
                        });
                    }
                }
            }
            createTextParticles(points);
        };
        img.src = src;
    }

    function createTextParticles(points) {
        if (textPoints !== null) {
            textGeometry.dispose();
            textMaterial.dispose();
            scene.remove(textPoints);
        }

        const positions = new Float32Array(points.length * 3);
        const colors = new Float32Array(points.length * 3);
        const baseColor = new THREE.Color('#ffffff'); // 文字纯白高亮

        for(let i=0; i<points.length; i++) {
            const i3 = i*3;
            positions[i3] = points[i].x * 1.5; // 初始缩放
            positions[i3+1] = points[i].y * 1.5;
            positions[i3+2] = points[i].z;
            
            colors[i3] = 1.0; colors[i3+1] = 1.0; colors[i3+2] = 1.0;
        }

        textGeometry = new THREE.BufferGeometry();
        textGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        textGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        textMaterial = new THREE.PointsMaterial({
            size: 0.05, // 文字粒子要比星系粒子大一点
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true
        });

        textPoints = new THREE.Points(textGeometry, textMaterial);
        scene.add(textPoints);
    }

    // --- 5. 交互与动画 ---
    
    // 初始化
    generateGalaxy();
    document.getElementById('loading').style.opacity = 0;
    setTimeout(() => document.getElementById('loading').remove(), 500);

    // 动画循环
    const clock = new THREE.Clock();

    function tick() {
        const elapsedTime = clock.getElapsedTime();

        // 旋转星系
        if(galaxyPoints) {
            galaxyPoints.rotation.y = elapsedTime * 0.05;
        }
        
        // 浮动文字 (如果存在)
        if(textPoints) {
            // 始终正对相机
            textPoints.lookAt(camera.position);
            // 垂直悬浮
            textPoints.position.y = Math.sin(elapsedTime * 0.5) * 0.5;
            
            // 动态缩放
            const scale = document.getElementById('textSize').value;
            textPoints.scale.set(scale, scale, scale);
        }

        controls.update();
        composer.render(); // 使用后处理渲染
        requestAnimationFrame(tick);
    }
    tick();

    // 窗口自适应
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    // UI 事件绑定
    document.getElementById('btnGen').addEventListener('click', () => {
        const file = document.getElementById('imageInput').files[0];
        if(!file) return alert('请选择图片');
        
        const reader = new FileReader();
        if(file.type.includes('svg')) {
            reader.readAsText(file);
            reader.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            reader.readAsDataURL(file);
            reader.onload = e => processSource(e.target.result);
        }
    });

    // 实时更新星系
    const updateGalaxy = () => {
        parameters.radius = parseFloat(document.getElementById('galaxySize').value);
        parameters.count = parseInt(document.getElementById('galaxyCount').value);
        parameters.insideColor = document.getElementById('colorInside').value;
        parameters.outsideColor = document.getElementById('colorOutside').value;
        generateGalaxy();
    };

    document.getElementById('galaxySize').addEventListener('input', updateGalaxy);
    document.getElementById('galaxyCount').addEventListener('input', updateGalaxy);
    document.getElementById('colorInside').addEventListener('input', updateGalaxy);
    document.getElementById('colorOutside').addEventListener('input', updateGalaxy);

</script>
</body>
</html>
