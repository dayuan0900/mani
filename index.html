<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <title>Mani - Sumeru Ring</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(20, 15, 5, 0.85); /* 深金褐色背景 */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 12px;
            padding: 20px; color: #fff; z-index: 100;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }
        
        .hidden { opacity: 0; pointer-events: none; transform: translateX(-30px); }

        h3 { 
            margin: 0 0 15px 0; color: #ffd700; font-size: 14px; 
            letter-spacing: 2px; text-align: center; text-transform: uppercase;
            border-bottom: 1px solid rgba(255,215,0,0.1); padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,215,0,0.4);
        }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            background: linear-gradient(135deg, #ffd700, #daa520);
            color: #000; font-weight: bold; cursor: pointer;
            transition: 0.2s; font-size: 12px; letter-spacing: 1px;
        }
        .btn:hover { box-shadow: 0 0 20px rgba(255,215,0,0.4); filter: brightness(1.1); }

        .control { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-bottom: 4px; letter-spacing: 1px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #ffd700; height: 2px; }
        input[type="color"] { width: 100%; border: none; height: 25px; padding: 0; background: none; cursor: pointer; }
        input[type="file"] { width: 100%; font-size: 10px; color: #888; }

        .hint { font-size: 9px; color: #666; text-align: center; margin-top: 10px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>SUMERU RING</h3>
    
    <div class="control">
        <label>SOURCE / 源文件</label>
        <input type="file" id="imageInput" accept="image/*,.svg">
        <button class="btn" onclick="runGen()">ACTIVATE / 激活</button>
    </div>

    <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <!-- 粒子数加倍 -->
    <div class="control">
        <label>TEXT DENSITY / 文字密度 (极高)</label>
        <input type="range" id="densityRange" min="1" max="5" step="1" value="4" oninput="resampleImage()">
    </div>

    <div class="control">
        <label>RING PARTICLES / 旋绕粒子量</label>
        <input type="range" id="ringCountRange" min="500" max="3000" step="500" value="2000" oninput="initOrbit()">
    </div>

    <div class="control">
        <label>ORBIT ANGLE / 旋绕视角 (扁平度)</label>
        <input type="range" id="tiltRange" min="0" max="100" value="15" oninput="config.orbitTilt=this.value*0.01">
    </div>

    <div class="control">
        <label>COLOR / 主题色</label>
        <input type="color" id="colorPicker" value="#ffd700" oninput="updateConfig('color', this.value)">
    </div>

    <div class="hint">按 <b>H</b> 键隐藏界面</div>
</div>

<canvas id="canvas"></canvas>

<script data-cfasync="false">
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let textParticles = [];
    let orbitParticles = []; 
    let cachedImageData = null; 
    let cachedWidth = 0;
    let cachedHeight = 0;

    let config = {
        baseX: 0, baseY: 0, 
        scale: 1,        
        targetScale: 0.40, 
        color: '#ffd700', 
        pSize: 1.0,      
        glow: 20,        
        orbitSpeed: 0.001, 
        orbitTilt: 0.15 // 默认很扁，像水平面
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        
        if (cachedWidth > 0) {
            config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
        }
        initOrbit();
    }
    window.addEventListener('resize', resize);

    // --- 1. 水平旋绕光环 (Horizontal Ring) ---
    function initOrbit() {
        orbitParticles = [];
        // 根据滑块获取粒子数量，默认增加到 2000+
        const count = parseInt(document.getElementById('ringCountRange').value) || 2000;
        
        for(let i=0; i<count; i++) {
            orbitParticles.push(new OrbitParticle());
        }
    }

    class OrbitParticle {
        constructor() { this.reset(); }
        reset() {
            this.angle = Math.random() * Math.PI * 2;
            
            // 半径分布：制造多层光环的感觉
            const ringType = Math.random();
            let baseR;
            if(ringType < 0.6) baseR = 400; // 主环
            else baseR = 600; // 外环
            
            this.radius = baseR + (Math.random()-0.5) * 150;
            
            // 速度：完全水平顺时针
            this.speed = (1000 / this.radius) * 0.0005 + Math.random() * 0.0002; 
            
            this.size = Math.random() * 1.5 + 0.5;
            this.alpha = Math.random() * 0.6 + 0.2;
        }

        update() {
            this.angle += this.speed; 
        }

        draw() {
            // 水平视角核心公式：
            // x = cos * r
            // y = sin * r * tilt (压扁系数)
            const x = config.baseX + Math.cos(this.angle) * this.radius * (window.innerWidth/1500); // 随屏幕宽度适配
            const y = config.baseY + Math.sin(this.angle) * this.radius * config.orbitTilt; 
            
            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI*2);
            
            // 深度模拟：后面的暗，前面的亮
            const z = Math.sin(this.angle); 
            const depthAlpha = this.alpha * (z > 0 ? 1 : 0.3);
            
            ctx.fillStyle = config.color;
            ctx.globalAlpha = depthAlpha;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    // --- 2. 图像引擎 (超高密度填缝版) ---
    function patchSVG(svg) {
        if (!svg.includes('width=') || !svg.includes('height=')) {
            return svg.replace('<svg', '<svg width="2000" height="2000" ');
        }
        return svg;
    }

    function processSource(src) {
        const img = new Image();
        img.onload = () => {
            // 使用 1500px 宽度采样，保证细节
            const w = 1500; const h = 1000;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            offCtx.fillStyle = '#808080';
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            cachedImageData = offCtx.getImageData(0,0,w,h).data;
            cachedWidth = w; cachedHeight = h;
            
            resampleImage(); 
            config.scale = (window.innerWidth * config.targetScale) / w; 
        };
        img.src = src;
    }

    function resampleImage() {
        if (!cachedImageData) return;
        textParticles = [];
        const val = parseInt(document.getElementById('densityRange').value);
        
        // 密度策略：
        // 5 (Max) = 步长1 (每个像素都采，极密)
        // 1 (Min) = 步长5
        const gap = Math.max(1, 6 - val); 
        
        const w = cachedWidth; const h = cachedHeight;
        for(let y=0; y<h; y+=gap) {
            for(let x=0; x<w; x+=gap) {
                const i = (y*w+x)*4;
                const lum = (cachedImageData[i] + cachedImageData[i+1] + cachedImageData[i+2])/3;
                if(Math.abs(lum - 128) > 20) {
                    textParticles.push({
                        // 加入随机抖动 (Jitter) 以消除网格感，让文字更像沙画
                        ox: (x-w/2) + (Math.random()-0.5)*gap*0.8, 
                        oy: (y-h/2) + (Math.random()-0.5)*gap*0.8,
                    });
                }
            }
        }
        // 如果粒子数过多，自动调小粒子尺寸，防止糊掉
        if (textParticles.length > 20000) config.pSize = 0.8;
        else config.pSize = 1.0;
    }

    // --- 3. 渲染循环 ---
    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; // 拖尾更短，画面更干净
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // A. 绘制右旋光环 (Background Ring)
        ctx.globalCompositeOperation = 'lighter';
        orbitParticles.forEach(p => {
            // 如果粒子在后面(z<0)，先画
            if(Math.sin(p.angle) < 0) { p.update(); p.draw(); }
        });

        // B. 绘制文字 (Text) - 绝对静止，如磐石
        ctx.shadowBlur = config.glow;             
        ctx.shadowColor = config.color;           
        ctx.fillStyle = '#FFFFFF'; 

        textParticles.forEach(p => {
            const tx = config.baseX + (p.ox * config.scale);
            const ty = config.baseY + (p.oy * config.scale);
            
            ctx.beginPath();
            ctx.arc(tx, ty, config.pSize, 0, Math.PI*2);
            ctx.fill();
        });

        // C. 绘制右旋光环 (Foreground Ring) - 画前面的，遮挡文字底部
        ctx.shadowBlur = 0; // 光环不需要太强光晕
        orbitParticles.forEach(p => {
            // 如果粒子在前面(z>0)，后画
            if(Math.sin(p.angle) >= 0) { p.update(); p.draw(); }
        });
        
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(animate);
    }

    // 交互
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("请选文件"); return; }
        const file = input.files[0];
        const r = new FileReader();
        if(file.type.includes('svg')) {
            r.readAsText(file);
            r.onload = e => {
                const url = URL.createObjectURL(new Blob([patchSVG(e.target.result)], {type:'image/svg+xml'}));
                processSource(url);
            };
        } else {
            r.readAsDataURL(file);
            r.onload = e => processSource(e.target.result);
        }
    };

    window.updateConfig = function(key, val) {
        if(key === 'zoom') {
            config.targetScale = val / 100;
            document.getElementById('val-zoom').innerText = val + '%';
            if(cachedWidth > 0) config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
        } else {
            config[key] = key === 'color' ? val : parseFloat(val);
        }
    };

    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'h') document.getElementById('ui').classList.toggle('hidden');
    });
    
    window.addEventListener('wheel', e => {
        let currentScale = config.targetScale;
        currentScale += e.deltaY * -0.0005;
        currentScale = Math.min(Math.max(0.1, currentScale), 1.0);
        config.targetScale = currentScale;
        document.getElementById('val-zoom').innerText = Math.round(currentScale*100) + '%';
        if(cachedWidth > 0) config.scale = (window.innerWidth * config.targetScale) / cachedWidth;
    });

    resize();
    initOrbit();
    animate();

</script>
</body>
</html>
