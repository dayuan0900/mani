<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani Mantra - Ethereal Nebula</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #000; 
            font-family: 'Segoe UI', sans-serif; user-select: none; 
        }

        /* 美化的磨砂玻璃 UI */
        #ui {
            position: absolute; top: 20px; left: 20px; width: 260px;
            background: rgba(20, 30, 40, 0.6); /* 高透 */
            backdrop-filter: blur(12px); /* 磨砂效果 */
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px; color: #fff; z-index: 100;
            transition: opacity 0.5s, transform 0.5s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 隐藏 UI 的类 */
        .hidden { opacity: 0; pointer-events: none; transform: translateY(-20px); }

        h3 { 
            margin: 0 0 20px 0; color: #00e5ff; font-weight: 300; 
            letter-spacing: 4px; text-align: center; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,229,255,0.4);
        }

        label { display: block; font-size: 11px; color: #88a; margin-bottom: 8px; letter-spacing: 1px; }

        /* 漂亮的按钮 */
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white; font-weight: bold; cursor: pointer;
            margin-top: 10px; font-size: 13px; letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5); }
        .btn:active { transform: translateY(0); }

        /* 漂亮的输入框 */
        input[type="file"] { font-size: 11px; color: #aaa; width: 100%; margin-bottom: 15px; }
        input[type="range"] { width: 100%; margin-bottom: 15px; cursor: pointer; accent-color: #00e5ff; }
        input[type="color"] { width: 100%; border: none; height: 30px; cursor: pointer; background: none; padding: 0; }

        .hint { font-size: 10px; color: #556; text-align: center; margin-top: 15px; }
        
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>Nebula Flow</h3>
    
    <label>IMAGE SOURCE</label>
    <input type="file" id="imageInput" accept="image/*,.svg">
    
    <button class="btn" onclick="runGen()">ACTIVATE / 激活</button>
    
    <div style="margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>

    <label>PARTICLE SIZE / 粒子大小</label>
    <input type="range" id="sizeRange" min="1" max="5" step="0.5" value="2.5">

    <label>THEME COLOR / 主题色</label>
    <input type="color" id="colorPicker" value="#00e5ff">

    <div class="hint">按 <b>H</b> 键隐藏/显示界面</div>
</div>

<canvas id="canvas"></canvas>

<script>
    // --- 0. 核心变量 ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let nebula = [];
    let config = {
        baseX: window.innerWidth/2, baseY: window.innerHeight/2, 
        scale: 1, color: '#00e5ff', pSize: 2.5
    };

    // --- 1. 初始化与响应 ---
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        config.baseX = canvas.width / 2;
        config.baseY = canvas.height / 2;
        // 重置星云
        nebula = [];
        for(let i=0; i<40; i++) {
            nebula.push({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                r: Math.random()*200+50,
                vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
                hue: Math.random()>0.5 ? 200:260, alpha: 0
            });
        }
    }
    window.addEventListener('resize', resize);
    resize(); // 立即执行

    // --- 2. 图像引擎 ---
    function processSource(imgSrc) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            const w = 800; const h = 600;
            const off = document.createElement('canvas');
            off.width = w; off.height = h;
            const offCtx = off.getContext('2d');
            
            offCtx.fillStyle = '#808080'; // 灰底
            offCtx.fillRect(0,0,w,h);
            
            const aspect = img.width/img.height||1;
            let dw=w, dh=w/aspect;
            if(dh>h){ dh=h; dw=h*aspect; }
            offCtx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
            
            const data = offCtx.getImageData(0,0,w,h).data;
            particles = [];
            const gap = 3;
            
            for(let y=0; y<h; y+=gap) {
                for(let x=0; x<w; x+=gap) {
                    const i = (y*w+x)*4;
                    const lum = (data[i]+data[i+1]+data[i+2])/3;
                    if(x+gap<w) {
                        const lum2 = (data[i+4*gap]+data[i+4*gap+1]+data[i+4*gap+2])/3;
                        if(Math.abs(lum-lum2) > 20) {
                            particles.push({
                                x: Math.random()*canvas.width,
                                y: Math.random()*canvas.height,
                                ox: x-w/2, oy: y-h/2,
                                vx:0, vy:0, offset: Math.random()*100
                            });
                        }
                    }
                }
            }
            if(particles.length > 0) config.scale = (window.innerWidth*0.8)/w;
            else alert("未检测到内容，请检查图片！");
        };
        img.src = imgSrc;
    }

    // --- 3. 交互逻辑 ---
    window.runGen = function() {
        const input = document.getElementById('imageInput');
        if(!input.files[0]) { alert("Please select an image first."); return; }
        const reader = new FileReader();
        reader.onload = e => processSource(e.target.result);
        reader.readAsDataURL(input.files[0]);
    };

    // UI 监听
    document.getElementById('sizeRange').oninput = function() { config.pSize = parseFloat(this.value); };
    document.getElementById('colorPicker').oninput = function() { config.color = this.value; };
    
    // 按 H 隐藏 UI
    window.addEventListener('keydown', (e) => {
        if(e.key.toLowerCase() === 'h') document.getElementById('ui').classList.toggle('hidden');
    });

    // --- 4. 渲染循环 ---
    function animate() {
        ctx.fillStyle = 'rgba(2,2,5,0.2)'; // 拖尾
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        const time = Date.now() * 0.002;

        // 星云
        ctx.globalCompositeOperation = 'lighter';
        nebula.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
            if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
            if(p.alpha<0.1) p.alpha+=0.0005;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
            g.addColorStop(0, `hsla(${p.hue}, 80%, 60%, ${p.alpha})`);
            g.addColorStop(1, 'transparent');
            ctx.fillStyle=g; ctx.fill();
        });

        // 粒子
        ctx.shadowBlur = 10; ctx.shadowColor = config.co
